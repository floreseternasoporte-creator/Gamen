// VOLUMETRIC LIGHT & GOD RAYS
// ═══════════════════════════════════════════════════════════════════════════
let volumetricLight = null;
let volumetricIntensity = 0;

function createVolumetricLight() {
    // Create a cone mesh that follows the flashlight
    const coneGeo = new THREE.ConeGeometry(2.5, 18, 24, 8, true);
    coneGeo.translate(0, -9, 0);
    coneGeo.rotateX(-Math.PI / 2);

    const coneMat = new THREE.ShaderMaterial({
        uniforms: {
            uIntensity: { value: 0.35 },
            uTime: { value: 0 }
        },
        vertexShader: `
            varying vec3 vPos;
            varying float vDepth;
            void main() {
                vPos = position;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vDepth = -mvPosition.z;
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform float uIntensity;
            uniform float uTime;
            varying vec3 vPos;
            varying float vDepth;

            void main() {
                // Distance along cone (0 at tip, 1 at base)
                float dist = length(vPos.xy) / 2.5;
                float along = (-vPos.z) / 18.0;

                // Noise for volumetric feel
                float noise = sin(vPos.z * 0.5 + uTime * 0.8) * 0.1 +
                              sin(vPos.x * 0.8 + uTime * 0.5) * 0.05;

                float alpha = uIntensity * (1.0 - along) * (1.0 - dist * 0.8);
                alpha *= 0.5 + noise * 0.5;
                alpha = max(0.0, alpha);

                // Warm light color
                vec3 col = vec3(1.0, 0.92, 0.78);

                // Edge softening
                float edge = smoothstep(0.7, 1.0, dist);
                alpha *= 1.0 - edge * 0.7;

                gl_FragColor = vec4(col, alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
    });

    volumetricLight = new THREE.Mesh(coneGeo, coneMat);
    volumetricLight.position.set(0, 0, 0);
    camera.add(volumetricLight);
}

        const wire = new THREE.Mesh(wireGeo, wireMat);
        wire.position.set(
            (Math.random() - 0.5) * (HALL_WIDTH - 1),
            WALL_HEIGHT - wireLen / 2,
            -3 - Math.random() * (HALL_LENGTH - 6)
        );
        scene.add(wire);
        swingingWires.push({
            mesh: wire,
            baseRotZ: wire.rotation.z,
            baseRotX: wire.rotation.x,
            phase: Math.random() * Math.PI * 2,
            speed: 0.4 + Math.random() * 0.3,
            ampZ: 0.03 + Math.random() * 0.05,
            ampX: 0.02 + Math.random() * 0.03
        });
    }

    // ── Creaking beds (subtle movement) ────────────────────────────────
    animatedObjects.push({
        type: 'beds',
        phase: 0,
        speed: 0.2
    });
}

function updateAnimatedObjects() {
    const t = clock.elapsedTime;

    // Update floating papers
    floatingPapers.forEach(p => {
        p.mesh.position.y = p.baseY + Math.sin(t * p.speed + p.phase) * p.floatAmp;
        p.mesh.position.x += Math.sin(t * p.speed * 0.7 + p.phase) * 0.002;
        p.mesh.position.z += Math.cos(t * p.speed * 0.5 + p.phase) * 0.002;
        p.mesh.rotation.x += p.rotSpeed.x * deltaTime;
        p.mesh.rotation.y += p.rotSpeed.y * deltaTime;
        p.mesh.rotation.z += p.rotSpeed.z * deltaTime;
    });

    // Update swinging wires
    swingingWires.forEach(w => {
        w.mesh.rotation.z = w.baseRotZ + Math.sin(t * w.speed + w.phase) * w.ampZ;
        w.mesh.rotation.x = w.baseRotX + Math.cos(t * w.speed * 0.8 + w.phase) * w.ampX;
    });

    // Update volumetric light
    if (volumetricLight) {
        volumetricLight.material.uniforms.uTime.value = t;
        // Flicker slightly
        const flicker = 0.9 + Math.sin(t * 12) * 0.05 + Math.sin(t * 27) * 0.03;
        volumetricLight.material.uniforms.uIntensity.value = 0.35 * flicker;
    }
}

// ENHANCED VISUAL EFFECTS (bloom simulation, chromatic aberration, etc.)
// ═══════════════════════════════════════════════════════════════════════════
let bloomOverlay = null;
let caIntensity = 0;
let motionBlurAmount = 0;

function applyPerformanceMode() {
    if (!PERFORMANCE_MODE) return;
    document.body.classList.add('performance-mode');
    // Las partículas siguen existiendo para no romper el juego, pero no se dibujan en el perfil ligero.
    [dustParticles, fogParticles, floatingDebris, bloodParticles, tkEnergyParticles].forEach(system => {
        if (system) system.visible = false;
    });
    if (volumetricLight) volumetricLight.visible = false;
}

function createEnhancedEffects() {
    // Dynamic chromatic aberration is handled via CSS

        ring1.className = 'tk-ring';

}

function updateEnhancedEffects() {
    const moving = direction.length() > 0 || Math.abs(joyCurrentX) > 0.01 || Math.abs(joyCurrentY) > 0.01;
    const speed = direction.length();

    // Dynamic chromatic aberration based on movement speed
    const caOverlay = document.querySelector('.chromatic-aberration');
    if (caOverlay) {
        const targetCA = moving ? 0.3 + speed * 0.2 : 0.1;
        caIntensity += (targetCA - caIntensity) * 0.05;
        caOverlay.style.opacity = caIntensity;
    }

    // Motion blur simulation (screen space)
    const glitch = document.getElementById('glitch-overlay');
    if (glitch && moving && speed > 0.5) {
        motionBlurAmount = Math.min(1, motionBlurAmount + deltaTime * 2);
    } else {
        motionBlurAmount = Math.max(0, motionBlurAmount - deltaTime * 3);
    }

    // Breathing vignette (subtle rhythm)
    const breathEl = document.getElementById('breath-vignette');
    if (breathEl) {
        const breathRate = moving ? 1.5 : 0.8;
        const breathPhase = Math.sin(clock.elapsedTime * breathRate) * 0.5 + 0.5;
        const baseOpacity = moving ? 0.4 : 0.55;
        breathEl.style.opacity = baseOpacity + breathPhase * 0.15;
        // Slight pulse in size
        const scale = 1 + breathPhase * 0.02;
        breathEl.style.transform = `scale(${scale})`;
    }

    // Cinematic bars during telekinesis (epic moments)
    const cineBars = document.getElementById('cinematic-bars');
    if (cineBars) {
        if (tkMode && tkTarget && tkLifted) {
            cineBars.classList.add('active');
        } else {
            cineBars.classList.remove('active');
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// ADVANCED PARTICLE SYSTEMS — volumetric dust, sparks, energy, fog
// ═══════════════════════════════════════════════════════════════════════════
let dustParticles = null;
let dustCount = 0;
let sparkSystems = [];
let tkEnergyParticles = null;
let fogParticles = null;
let floatingDebris = null;
let bloodParticles = null;

function createDust() {
    // ── Volumetric dust motes (illuminated by flashlight) ────────────────
    dustCount = PERFORMANCE_MODE ? 260 : 800;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    const dustSize = new Float32Array(dustCount);
    const dustPhase = new Float32Array(dustCount);
    const dustColor = new Float32Array(dustCount * 3);

    for (let i = 0; i < dustCount; i++) {
        dustPos[i * 3]     = (Math.random() - 0.5) * HALL_WIDTH * 1.2;
        dustPos[i * 3 + 1] = Math.random() * WALL_HEIGHT;
        dustPos[i * 3 + 2] = -Math.random() * HALL_LENGTH;
        dustSize[i]        = 0.015 + Math.random() * 0.035;
        dustPhase[i]       = Math.random() * Math.PI * 2;
        const warm = 0.7 + Math.random() * 0.3;
        dustColor[i * 3]     = 1.0 * warm;
        dustColor[i * 3 + 1] = 0.92 * warm;
        dustColor[i * 3 + 2] = 0.78 * warm;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    dustGeo.setAttribute('size', new THREE.BufferAttribute(dustSize, 1));
    dustGeo.setAttribute('phase', new THREE.BufferAttribute(dustPhase, 1));
    dustGeo.setAttribute('color', new THREE.BufferAttribute(dustColor, 3));

    const dustMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uCameraPos: { value: new THREE.Vector3() },
            uFlashlightPos: { value: new THREE.Vector3() },
            uFlashlightDir: { value: new THREE.Vector3(0, 0, -1) },
            uFlashlightOn: { value: 1.0 }
        },
        vertexShader: `
            attribute float size;
            attribute float phase;
            attribute vec3 color;
            varying vec3 vColor;
            varying float vBrightness;
            varying float vDepth;
            uniform float uTime;
            uniform vec3 uCameraPos;
            uniform vec3 uFlashlightPos;
            uniform vec3 uFlashlightDir;
            uniform float uFlashlightOn;

            void main() {
                vColor = color;
                vec3 pos = position;
                pos.x += sin(uTime * 0.3 + phase) * 0.15;
                pos.y += sin(uTime * 0.5 + phase * 1.3) * 0.08;
                pos.z += cos(uTime * 0.2 + phase * 0.7) * 0.2;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vDepth = -mvPosition.z;

                vec3 toParticle = pos - uFlashlightPos;
                float dist = length(toParticle);
                vec3 toPartNorm = normalize(toParticle);
                float angleDot = dot(uFlashlightDir, -toPartNorm);
                float coneFactor = smoothstep(0.7, 0.95, angleDot);
                float distFactor = 1.0 - smoothstep(0.0, 20.0, dist);
                vBrightness = coneFactor * distFactor * uFlashlightOn * 2.5;
                vBrightness += 0.15;

                gl_PointSize = size * (300.0 / -mvPosition.z) * (0.8 + vBrightness * 1.5);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying vec3 vColor;
            varying float vBrightness;
            varying float vDepth;

            void main() {
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
                alpha *= 0.6 + vBrightness * 0.8;
                alpha *= 1.0 - smoothstep(10.0, 35.0, vDepth);
                gl_FragColor = vec4(vColor * (0.6 + vBrightness * 1.2), alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
    });

    dustParticles = new THREE.Points(dustGeo, dustMat);
    dustParticles.frustumCulled = false;
    scene.add(dustParticles);

    // ── Fog / mist particles (larger, slower, volumetric feel) ──────────
    const fogCount = PERFORMANCE_MODE ? 36 : 120;
    const fogGeo = new THREE.BufferGeometry();
    const fogPos = new Float32Array(fogCount * 3);
    const fogSize = new Float32Array(fogCount);
    const fogPhase = new Float32Array(fogCount);

    for (let i = 0; i < fogCount; i++) {
        fogPos[i * 3]     = (Math.random() - 0.5) * HALL_WIDTH * 1.5;
        fogPos[i * 3 + 1] = 0.3 + Math.random() * 1.5;
        fogPos[i * 3 + 2] = -Math.random() * HALL_LENGTH;
        fogSize[i]        = 1.5 + Math.random() * 3.0;
        fogPhase[i]       = Math.random() * Math.PI * 2;
    }
    fogGeo.setAttribute('position', new THREE.BufferAttribute(fogPos, 3));
    fogGeo.setAttribute('size', new THREE.BufferAttribute(fogSize, 1));
    fogGeo.setAttribute('phase', new THREE.BufferAttribute(fogPhase, 1));

    const fogMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 }
        },
        vertexShader: `
            attribute float size;
            attribute float phase;
            varying float vAlpha;
            varying float vDepth;
            uniform float uTime;

            void main() {
                vec3 pos = position;
                pos.x += sin(uTime * 0.08 + phase) * 0.8;
                pos.z += cos(uTime * 0.06 + phase * 1.2) * 1.0;
                pos.y += sin(uTime * 0.1 + phase * 0.5) * 0.2;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vDepth = -mvPosition.z;
                vAlpha = 0.08 + 0.06 * sin(uTime * 0.3 + phase);

                gl_PointSize = size * (200.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying float vAlpha;
            varying float vDepth;

            void main() {
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                float alpha = 1.0 - smoothstep(0.2, 0.5, dist);
                alpha *= vAlpha;
                alpha *= 1.0 - smoothstep(5.0, 30.0, vDepth);
                gl_FragColor = vec4(0.45, 0.42, 0.38, alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.NormalBlending
    });

    fogParticles = new THREE.Points(fogGeo, fogMat);
    fogParticles.frustumCulled = false;
    scene.add(fogParticles);

    // ── Floating debris / paper pieces (larger, more visible) ───────────
    const debrisCount = PERFORMANCE_MODE ? 16 : 40;
    const debGeo = new THREE.BufferGeometry();
    const debPos = new Float32Array(debrisCount * 3);
    const debSize = new Float32Array(debrisCount);
    const debPhase = new Float32Array(debrisCount);
    const debRot = new Float32Array(debrisCount);

    for (let i = 0; i < debrisCount; i++) {
        debPos[i * 3]     = (Math.random() - 0.5) * HALL_WIDTH * 0.9;
        debPos[i * 3 + 1] = 0.5 + Math.random() * 2.5;
        debPos[i * 3 + 2] = -5 - Math.random() * (HALL_LENGTH - 10);
        debSize[i]        = 0.04 + Math.random() * 0.08;
        debPhase[i]       = Math.random() * Math.PI * 2;
        debRot[i]         = Math.random() * Math.PI;
    }
    debGeo.setAttribute('position', new THREE.BufferAttribute(debPos, 3));
    debGeo.setAttribute('size', new THREE.BufferAttribute(debSize, 1));
    debGeo.setAttribute('phase', new THREE.BufferAttribute(debPhase, 1));
    debGeo.setAttribute('rotSpeed', new THREE.BufferAttribute(debRot, 1));

    const debMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 }
        },
        vertexShader: `
            attribute float size;
            attribute float phase;
            attribute float rotSpeed;
            varying float vAlpha;
            varying float vDepth;
            varying float vRot;
            uniform float uTime;

            void main() {
                vec3 pos = position;
                pos.x += sin(uTime * 0.4 + phase) * 0.4;
                pos.y += sin(uTime * 0.3 + phase * 1.5) * 0.15;
                pos.z += cos(uTime * 0.25 + phase * 0.8) * 0.5;

                vRot = uTime * rotSpeed + phase;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vDepth = -mvPosition.z;
                vAlpha = 0.5 + 0.3 * sin(uTime * 0.5 + phase);

                gl_PointSize = size * (400.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying float vAlpha;
            varying float vDepth;
            varying float vRot;

            void main() {
                vec2 uv = gl_PointCoord - vec2(0.5);
                float c = cos(vRot);
                float s = sin(vRot);
                vec2 rotated = vec2(uv.x * c - uv.y * s, uv.x * s + uv.y * c);
                float w = 0.5;
                float h = 0.25;
                if (abs(rotated.x) > w || abs(rotated.y) > h) discard;
                float alpha = vAlpha * 0.7;
                alpha *= 1.0 - smoothstep(w * 0.7, w, abs(rotated.x));
                alpha *= 1.0 - smoothstep(5.0, 25.0, vDepth);
                gl_FragColor = vec4(0.75, 0.72, 0.62, alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
    });

    floatingDebris = new THREE.Points(debGeo, debMat);
    floatingDebris.frustumCulled = false;
    scene.add(floatingDebris);
}

function createSparkSystem(x, y, z) {
    const sparkCount = 30;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(sparkCount * 3);
    const vel = new Float32Array(sparkCount * 3);
    const life = new Float32Array(sparkCount);
    const maxLife = new Float32Array(sparkCount);

    for (let i = 0; i < sparkCount; i++) {
        pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
        life[i] = Math.random();
        maxLife[i] = 0.3 + Math.random() * 0.7;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('life', new THREE.BufferAttribute(life, 1));
    geo.setAttribute('maxLife', new THREE.BufferAttribute(maxLife, 1));

    const mat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: `
            attribute float life;
            attribute float maxLife;
            varying float vAlpha;
            varying float vDepth;
            void main() {
                vAlpha = 1.0 - (life / maxLife);
                vAlpha = pow(vAlpha, 0.5);
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vDepth = -mvPosition.z;
                gl_PointSize = (2.0 + vAlpha * 4.0) * (150.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying float vAlpha;
            varying float vDepth;
            void main() {
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                float alpha = (1.0 - smoothstep(0.0, 0.5, dist)) * vAlpha;
                alpha *= 1.0 - smoothstep(3.0, 15.0, vDepth);
                vec3 col = mix(vec3(1.0, 0.9, 0.6), vec3(1.0, 0.4, 0.1), dist * 2.0);
                gl_FragColor = vec4(col, alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
    });

    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    scene.add(points);
    sparkSystems.push({
        points,
        posArray: pos,
        velArray: vel,
        lifeArray: life,
        maxLifeArray: maxLife,
        sparkCount,
        originX: x, originY: y, originZ: z,
        emitTimer: 0
    });
}

function setupScreenParticles() {
    // ── Telekinesis energy particles (orbiting reticle effect) ──────────
    const tkCount = PERFORMANCE_MODE ? 28 : 60;
    const tkGeo = new THREE.BufferGeometry();
    const tkPos = new Float32Array(tkCount * 3);
    const tkPhase = new Float32Array(tkCount);
    const tkRadius = new Float32Array(tkCount);
    const tkSpeed = new Float32Array(tkCount);

    for (let i = 0; i < tkCount; i++) {
        tkPhase[i] = Math.random() * Math.PI * 2;
        tkRadius[i] = 0.3 + Math.random() * 0.8;
        tkSpeed[i] = 0.5 + Math.random() * 2.0;
    }
    tkGeo.setAttribute('position', new THREE.BufferAttribute(tkPos, 3));
    tkGeo.setAttribute('phase', new THREE.BufferAttribute(tkPhase, 1));
    tkGeo.setAttribute('radius', new THREE.BufferAttribute(tkRadius, 1));
    tkGeo.setAttribute('speed', new THREE.BufferAttribute(tkSpeed, 1));

    const tkMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uActive: { value: 0.0 },
            uTargetPos: { value: new THREE.Vector3() }
        },
        vertexShader: `
            attribute float phase;
            attribute float radius;
            attribute float speed;
            uniform float uTime;
            uniform float uActive;
            uniform vec3 uTargetPos;
            varying float vAlpha;
            varying float vDepth;

            void main() {
                float angle = uTime * speed + phase;
                vec3 pos = uTargetPos;
                pos.x += cos(angle) * radius;
                pos.y += sin(angle * 1.3) * radius * 0.6;
                pos.z += sin(angle * 0.7) * radius * 0.4;
                pos.y += sin(uTime * speed * 0.5 + phase) * 0.2;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vDepth = -mvPosition.z;
                vAlpha = uActive * (0.5 + 0.5 * sin(uTime * 2.0 + phase));

                gl_PointSize = (3.0 + radius * 4.0) * (200.0 / -mvPosition.z) * uActive;
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying float vAlpha;
            varying float vDepth;
            void main() {
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                float alpha = (1.0 - smoothstep(0.0, 0.5, dist)) * vAlpha;
                alpha *= 1.0 - smoothstep(2.0, 12.0, vDepth);
                vec3 col = mix(vec3(0.4, 0.1, 1.0), vec3(0.0, 0.8, 1.0), dist * 2.0);
                gl_FragColor = vec4(col, alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
    });

    tkEnergyParticles = new THREE.Points(tkGeo, tkMat);
    tkEnergyParticles.frustumCulled = false;
    scene.add(tkEnergyParticles);

    // ── Blood drip particles (for horror atmosphere) ────────────────────
    const bloodCount = PERFORMANCE_MODE ? 8 : 20;
    const bloodGeo = new THREE.BufferGeometry();
    const bloodPos = new Float32Array(bloodCount * 3);
    const bloodPhase = new Float32Array(bloodCount);
    const bloodSpeed = new Float32Array(bloodCount);

    for (let i = 0; i < bloodCount; i++) {
        bloodPos[i * 3] = (Math.random() - 0.5) * HALL_WIDTH * 0.8;
        bloodPos[i * 3 + 1] = WALL_HEIGHT;
        bloodPos[i * 3 + 2] = -Math.random() * HALL_LENGTH;
        bloodPhase[i] = Math.random() * Math.PI * 2;
        bloodSpeed[i] = 0.2 + Math.random() * 0.5;
    }
    bloodGeo.setAttribute('position', new THREE.BufferAttribute(bloodPos, 3));
    bloodGeo.setAttribute('phase', new THREE.BufferAttribute(bloodPhase, 1));
    bloodGeo.setAttribute('speed', new THREE.BufferAttribute(bloodSpeed, 1));

    const bloodMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: `
            attribute float phase;
            attribute float speed;
            uniform float uTime;
            varying float vAlpha;
            varying float vDepth;
            varying float vDripLen;

            void main() {
                vec3 pos = position;
                float drip = mod(uTime * speed + phase, 1.0);
                pos.y = 3.5 - drip * 3.5 * 0.7;
                vDripLen = drip;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vDepth = -mvPosition.z;
                vAlpha = 0.3 + 0.4 * sin(uTime * 0.5 + phase);
                vAlpha *= smoothstep(0.0, 0.1, drip) * (1.0 - smoothstep(0.85, 1.0, drip));

                gl_PointSize = 3.0 * (100.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying float vAlpha;
            varying float vDepth;
            varying float vDripLen;
            void main() {
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                float alpha = (1.0 - smoothstep(0.0, 0.5, dist)) * vAlpha;
                alpha *= 1.0 - smoothstep(3.0, 15.0, vDepth);
                gl_FragColor = vec4(0.5, 0.02, 0.02, alpha);
            }
        `,
        transparent: true,
        depthWrite: false
    });

    bloodParticles = new THREE.Points(bloodGeo, bloodMat);
    bloodParticles.frustumCulled = false;
    scene.add(bloodParticles);
}

function updateScreenParticles() {
    const t = clock.elapsedTime;

    if (dustParticles) {
        const mat = dustParticles.material;
        mat.uniforms.uTime.value = t;
        mat.uniforms.uCameraPos.value.copy(camera.position);
        const flWorldPos = new THREE.Vector3();
        flashlight.getWorldPosition(flWorldPos);
        mat.uniforms.uFlashlightPos.value.copy(flWorldPos);
        const flDir = new THREE.Vector3(0, 0, -1);
        flDir.applyQuaternion(camera.quaternion);
        mat.uniforms.uFlashlightDir.value.copy(flDir);
    }

    if (fogParticles) {
        fogParticles.material.uniforms.uTime.value = t;
    }

    if (floatingDebris) {
        floatingDebris.material.uniforms.uTime.value = t;
    }

    if (bloodParticles) {
        bloodParticles.material.uniforms.uTime.value = t;
    }

    sparkSystems.forEach(sys => {
        sys.emitTimer -= deltaTime;
        if (sys.emitTimer <= 0) {
            sys.emitTimer = 0.05 + Math.random() * 0.15;
            const emitCount = 2 + Math.floor(Math.random() * 3);
            for (let e = 0; e < emitCount; e++) {
                for (let i = 0; i < sys.sparkCount; i++) {
                    if (sys.lifeArray[i] >= sys.maxLifeArray[i]) {
                        sys.posArray[i * 3] = sys.originX + (Math.random() - 0.5) * 0.05;
                        sys.posArray[i * 3 + 1] = sys.originY;
                        sys.posArray[i * 3 + 2] = sys.originZ + (Math.random() - 0.5) * 0.05;
                        sys.velArray[i * 3] = (Math.random() - 0.5) * 2;
                        sys.velArray[i * 3 + 1] = 1 + Math.random() * 3;
                        sys.velArray[i * 3 + 2] = (Math.random() - 0.5) * 2;
                        sys.lifeArray[i] = 0;
                        sys.maxLifeArray[i] = 0.2 + Math.random() * 0.6;
                        break;
                    }
                }
            }
        }
        for (let i = 0; i < sys.sparkCount; i++) {
            if (sys.lifeArray[i] < sys.maxLifeArray[i]) {
                sys.lifeArray[i] += deltaTime;
                sys.posArray[i * 3] += sys.velArray[i * 3] * deltaTime;
                sys.posArray[i * 3 + 1] += sys.velArray[i * 3 + 1] * deltaTime;
                sys.posArray[i * 3 + 2] += sys.velArray[i * 3 + 2] * deltaTime;
                sys.velArray[i * 3 + 1] -= 5 * deltaTime;
                sys.velArray[i * 3] *= 0.98;
                sys.velArray[i * 3 + 2] *= 0.98;
            }
        }
        sys.points.geometry.attributes.position.needsUpdate = true;
        sys.points.geometry.attributes.life.needsUpdate = true;
        sys.points.material.uniforms.uTime.value = t;
    });

    if (tkEnergyParticles) {
        const mat = tkEnergyParticles.material;
        mat.uniforms.uTime.value = t;
        mat.uniforms.uActive.value = tkMode && tkTarget ? 1.0 : 0.0;
        if (tkTarget) {
            mat.uniforms.uTargetPos.value.copy(tkTarget.position);
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// LOBBY / WAITING ROOM / RECEPTION AREA
// ═══════════════════════════════════════════════════════════════════════════

function buildLobby() {
    const LW = 20, LD = 22, LH = 4.5;
    const LZS = 2, LZE = 24, LCZ = 13;

    // ── Floor texture: cracked institutional tiles ─────────────────────────
    const lobbyFloorTex = createTexture(2048, 2048, (ctx, w, h) => {
        ctx.fillStyle = '#949088'; ctx.fillRect(0, 0, w, h);
        const ts = 180;
        for (let gx = 0; gx < w; gx += ts) {
            for (let gy = 0; gy < h; gy += ts) {
                const shade = 128 + Math.floor(Math.random() * 30);
                ctx.fillStyle = `rgb(${shade},${shade - 1},${shade - 3})`;
                ctx.fillRect(gx + 3, gy + 3, ts - 6, ts - 6);
                for (let s = 0; s < 3; s++) {
                    ctx.fillStyle = `rgba(70,65,60,${0.04 + Math.random() * 0.09})`;
                    ctx.beginPath();
                    ctx.arc(gx + Math.random() * ts, gy + Math.random() * ts, 8 + Math.random() * 28, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        ctx.strokeStyle = 'rgba(22,22,18,0.88)'; ctx.lineWidth = 5;
        for (let i = 0; i <= w; i += ts) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke(); }
        for (let i = 0; i <= h; i += ts) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke(); }
        for (let i = 0; i < 8; i++) {
            const bx = Math.random() * w, by = Math.random() * h;
            const bg = ctx.createRadialGradient(bx, by, 0, bx, by, 35 + Math.random() * 65);
            bg.addColorStop(0, 'rgba(88,4,4,0.75)'); bg.addColorStop(1, 'rgba(55,2,2,0)');
            ctx.fillStyle = bg; ctx.beginPath();
            ctx.ellipse(bx, by, 50 + Math.random() * 55, 30 + Math.random() * 40, Math.random() * Math.PI, 0, Math.PI * 2);
            ctx.fill();
        }
        for (let i = 0; i < 22; i++) {
            ctx.strokeStyle = 'rgba(8,8,6,0.42)'; ctx.lineWidth = 1.2;
            let cx = Math.random() * w, cy = Math.random() * h;
            ctx.beginPath(); ctx.moveTo(cx, cy);
            for (let j = 0; j < 5; j++) { cx += (Math.random() - 0.5) * 75; cy += (Math.random() - 0.5) * 75; ctx.lineTo(cx, cy); }
            ctx.stroke();
        }
        drawDirt(ctx, w, h, 4000);
    });
    lobbyFloorTex.wrapS = lobbyFloorTex.wrapT = THREE.RepeatWrapping;
    lobbyFloorTex.repeat.set(LW / 5, LD / 5);
    const lobbyFloorMat = new THREE.MeshStandardMaterial({ map: lobbyFloorTex, roughness: 0.48, metalness: 0.13 });

    // ── Wall texture: peeling institutional paint + dado rail ──────────────
    const lobbyWallTex = createTexture(1024, 1024, (ctx, w, h) => {
        ctx.fillStyle = '#4c4e45'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#1d201a'; ctx.fillRect(0, h * 0.62, w, h * 0.38);
        ctx.strokeStyle = 'rgba(10,10,8,0.95)'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(0, h * 0.62); ctx.lineTo(w, h * 0.62); ctx.stroke();
        for (let i = 0; i < 18; i++) {
            ctx.strokeStyle = `rgba(${120 + Math.random() * 20},${18 + Math.random() * 12},${8 + Math.random() * 10},0.35)`;
            ctx.lineWidth = 2 + Math.random() * 2;
            ctx.beginPath(); ctx.moveTo(Math.random() * w, Math.random() * h * 0.5);
            ctx.lineTo(Math.random() * w, Math.random() * h); ctx.stroke();
        }
        for (let i = 0; i < 8; i++) {
            const gx = ctx.createRadialGradient(Math.random() * w, Math.random() * h * 0.65, 0, Math.random() * w, Math.random() * h * 0.65, 80 + Math.random() * 120);
            gx.addColorStop(0, 'rgba(140,10,10,0.22)'); gx.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gx; ctx.fillRect(0, 0, w, h);
        }
        drawPeelingPaint(ctx, w, h); drawDirt(ctx, w, h, 2800);
        drawRustStreak(ctx, w * 0.22, 0, h * 0.55, 22);
        drawRustStreak(ctx, w * 0.68, 0, h * 0.45, 18);
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, 'rgba(0,0,0,0.35)'); grad.addColorStop(0.15, 'transparent');
        grad.addColorStop(0.85, 'transparent'); grad.addColorStop(1, 'rgba(0,0,0,0.9)');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
    });
    const lobbyWallMat = new THREE.MeshStandardMaterial({ map: lobbyWallTex, roughness: 0.94 });

    // ── Ceiling texture: drop tiles with missing panels ────────────────────
    const ceilTexL = createTexture(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#5e5c56'; ctx.fillRect(0, 0, w, h);
        drawDirt(ctx, w, h, 500);
        ctx.strokeStyle = 'rgba(10,10,8,0.92)'; ctx.lineWidth = 5;
        for (let i = 0; i <= w; i += 128) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke(); }
        for (let i = 0; i <= h; i += 128) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke(); }
        [[0, 0], [2, 1], [1, 3], [3, 2], [0, 2]].forEach(([gx, gy]) => {
            ctx.fillStyle = '#040404'; ctx.fillRect(gx * 128 + 2, gy * 128 + 2, 124, 124);
        });
        for (let i = 0; i < 8; i++) {
            const wg = ctx.createRadialGradient(Math.random() * w, Math.random() * h, 0, Math.random() * w, Math.random() * h, 55 + Math.random() * 80);
            wg.addColorStop(0, 'rgba(55,44,18,0.55)'); wg.addColorStop(1, 'rgba(30,22,8,0)');
            ctx.fillStyle = wg; ctx.fillRect(0, 0, w, h);
        }
    });
    ceilTexL.wrapS = ceilTexL.wrapT = THREE.RepeatWrapping;
    ceilTexL.repeat.set(LW / 4, LD / 4);
    const ceilMatL = new THREE.MeshStandardMaterial({ map: ceilTexL, roughness: 1.0 });

    // ── Desk texture: dark aged wood ───────────────────────────────────────
    const deskTex = createTexture(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#1e1408'; ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 90; i++) {
            ctx.strokeStyle = `rgba(${32 + Math.random() * 15},${22 + Math.random() * 10},${8 + Math.random() * 8},0.25)`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, Math.random() * h);
            ctx.bezierCurveTo(w * 0.3, Math.random() * h, w * 0.7, Math.random() * h, w, Math.random() * h);
            ctx.stroke();
        }
        drawDirt(ctx, w, h, 400);
        const tg = ctx.createLinearGradient(0, 0, 0, h);
        tg.addColorStop(0, 'rgba(55,38,20,0.4)'); tg.addColorStop(1, 'rgba(8,5,2,0.6)');
        ctx.fillStyle = tg; ctx.fillRect(0, 0, w, h);
    });
    const deskMat = new THREE.MeshStandardMaterial({ map: deskTex, roughness: 0.7, metalness: 0.08 });
    const deskTopMat = new THREE.MeshStandardMaterial({ color: 0x16100a, roughness: 0.55, metalness: 0.15 });

    // ── Floor ──────────────────────────────────────────────────────────────
    const lobFloor = new THREE.Mesh(new THREE.PlaneGeometry(LW, LD), lobbyFloorMat);
    lobFloor.rotation.x = -Math.PI / 2; lobFloor.position.set(0, 0, LCZ);
    lobFloor.receiveShadow = true; scene.add(lobFloor);

    // ── Ceiling ────────────────────────────────────────────────────────────
    const lobCeil = new THREE.Mesh(new THREE.PlaneGeometry(LW, LD), ceilMatL);
    lobCeil.rotation.x = Math.PI / 2; lobCeil.position.set(0, LH, LCZ);
    lobCeil.receiveShadow = true; scene.add(lobCeil);

    // ── West wall (x = -10): waiting room side ─────────────────────────────
    const westWall = new THREE.Mesh(new THREE.PlaneGeometry(LD, LH), lobbyWallMat);
    westWall.rotation.y = Math.PI / 2; westWall.position.set(-LW / 2, LH / 2, LCZ);
    westWall.receiveShadow = true; scene.add(westWall);

    // ── East wall (x = +10): admissions corridor side ──────────────────────
    const CORR_W = 4.5, CORR_H = 3.0, CORR_Z = LZS + LD * 0.68;
    // South solid
    const eastSeg = LD - CORR_W - (LZE - CORR_Z - CORR_W);
    const eastA = new THREE.Mesh(new THREE.PlaneGeometry(eastSeg, LH), lobbyWallMat);
    eastA.rotation.y = -Math.PI / 2; eastA.position.set(LW / 2, LH / 2, LZS + eastSeg / 2);
    eastA.receiveShadow = true; scene.add(eastA);
    // North solid
    const northSegLen = LZE - (CORR_Z + CORR_W);
    if (northSegLen > 0) {
        const eastC = new THREE.Mesh(new THREE.PlaneGeometry(northSegLen, LH), lobbyWallMat);
        eastC.rotation.y = -Math.PI / 2; eastC.position.set(LW / 2, LH / 2, LZE - northSegLen / 2);
        eastC.receiveShadow = true; scene.add(eastC);
    }
    // Above corridor opening
    const eastTop = new THREE.Mesh(new THREE.PlaneGeometry(CORR_W, LH - CORR_H), lobbyWallMat);
    eastTop.rotation.y = -Math.PI / 2; eastTop.position.set(LW / 2, CORR_H + (LH - CORR_H) / 2, CORR_Z + CORR_W / 2);
    eastTop.receiveShadow = true; scene.add(eastTop);
    // Corridor frame
    const corrFrameMat = new THREE.MeshStandardMaterial({ color: 0x282820, roughness: 0.9 });
    const corrFrameT = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, CORR_W), corrFrameMat);
    corrFrameT.position.set(LW / 2 - 0.075, CORR_H, CORR_Z + CORR_W / 2); scene.add(corrFrameT);
    for (const sz of [CORR_Z, CORR_Z + CORR_W]) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, CORR_H, 0.12), corrFrameMat);
        post.position.set(LW / 2 - 0.06, CORR_H / 2, sz); scene.add(post);
    }
    // Dark corridor visible through opening
    const corrDepthMat = new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 1.0 });
    const corrDepth = new THREE.Mesh(new THREE.PlaneGeometry(CORR_H, CORR_W), corrDepthMat);
    corrDepth.rotation.y = -Math.PI / 2; corrDepth.position.set(LW / 2 + 1.5, CORR_H / 2, CORR_Z + CORR_W / 2);
    // El corredor deja de ser un fondo: conecta con el ala de hidroterapia.
    corrDepth.visible = false;
    scene.add(corrDepth);
    // Red light deep in admissions corridor
    const corrRedLight = new THREE.PointLight(0xdd0000, 3.5, 8);
    corrRedLight.position.set(LW / 2 + 3, 1.8, CORR_Z + CORR_W / 2);
    scene.add(corrRedLight);
    lights.push({ light: corrRedLight, mat: null, baseInt: 3.5, isBroken: true });

    // ── South wall (z=2): connects to hallway ──────────────────────────────
    const hallOW = HALL_WIDTH, sideSegW = (LW - hallOW) / 2;
    const southL = new THREE.Mesh(new THREE.BoxGeometry(sideSegW, LH, 0.22), lobbyWallMat);
    southL.position.set(-(hallOW / 2 + sideSegW / 2), LH / 2, LZS + 0.11);
    southL.castShadow = true; southL.receiveShadow = true; scene.add(southL);
    const southR = new THREE.Mesh(new THREE.BoxGeometry(sideSegW, LH, 0.22), lobbyWallMat);
    southR.position.set(hallOW / 2 + sideSegW / 2, LH / 2, LZS + 0.11);
    southR.castShadow = true; southR.receiveShadow = true; scene.add(southR);
    if (LH > WALL_HEIGHT) {
        const topH = LH - WALL_HEIGHT;
        const southMid = new THREE.Mesh(new THREE.BoxGeometry(hallOW, topH, 0.22), lobbyWallMat);
        southMid.position.set(0, WALL_HEIGHT + topH / 2, LZS + 0.11);
        southMid.castShadow = true; southMid.receiveShadow = true; scene.add(southMid);
    }
    // Archway header sign: PABELLÓN ABANDONADO
    const hallSignTex = createTexture(512, 96, (ctx, w, h) => {
        ctx.fillStyle = 'rgba(8,8,6,0.92)'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(175,155,90,0.9)'; ctx.font = 'bold 38px "Arial Black",Arial,sans-serif';
        ctx.textAlign = 'center'; ctx.fillText('PABELLÓN ABANDONADO', w / 2, 62);
        ctx.strokeStyle = 'rgba(110,90,45,0.55)'; ctx.lineWidth = 3; ctx.strokeRect(4, 4, w - 8, h - 8);
    });
    const hallSign = new THREE.Mesh(new THREE.PlaneGeometry(hallOW - 0.1, 0.5),
        new THREE.MeshStandardMaterial({ map: hallSignTex, roughness: 0.8, emissive: 0x201800, emissiveIntensity: 0.25 }));
    hallSign.position.set(0, WALL_HEIGHT + 0.32, LZS + 0.28); scene.add(hallSign);

    // ── Main entrance: large broken glass doors (north wall, z=24) ─────────
    buildMainEntrance(LW, LH, LZE, lobbyWallMat);

    // ── Reception desk ─────────────────────────────────────────────────────
    buildReceptionDesk(deskMat, deskTopMat, LZS, LZE);

    // ── Waiting area (left side) ───────────────────────────────────────────
    buildWaitingArea(LZS, LZE, LW);

    // ── Vending machines (west wall, left side) ────────────────────────────
    buildVendingMachine(-LW / 2 + 0.55, LZS + 5);
    buildVendingMachine(-LW / 2 + 0.55, LZS + 8.5);

    // ── Directional signs ─────────────────────────────────────────────────
    buildLobbySigns(LW, LH, LCZ, LZE, CORR_Z, CORR_W);

    // ── Wall sconces (replacing ceiling lights) ────────────────────────────
    for (let lz = LZS + 3; lz < LZE - 1; lz += 5) {
        createWallSconce(-LW / 2, lz);
        createWallSconce(LW / 2, lz);
    }

    // ── Moonlight through main entrance ────────────────────────────────────
    const moon = new THREE.SpotLight(0x4466bb, 18, 50, Math.PI / 5.5, 0.6, 1.2);
    moon.position.set(0, LH + 10, LZE + 6);
    moon.target.position.set(1, 0, LZE - 4);
    moon.castShadow = false;
    scene.add(moon); scene.add(moon.target);
    lights.push({ light: moon, mat: null, baseInt: 18, isBroken: false });

    // Blue ambient fill (moonlight spill)
    const lobbyAmb = new THREE.PointLight(0x1a2240, 1.65, 28);
    lobbyAmb.position.set(0, 3, LCZ);
    scene.add(lobbyAmb);
    lights.push({ light: lobbyAmb, mat: null, baseInt: 1.65, isBroken: false });

    // ── Floor debris scattered throughout lobby ─────────────────────────────
    buildLobbyDebris(LW, LD, LZS);
    buildSculptedLobbyDetails();
}

// Mobiliario de primer plano: piezas con estructura, herrajes, ruedas y textiles.
function buildSculptedLobbyDetails() {
    const gurney = createDetailedGurney(-5.7, 15.2, -0.32);
    scene.add(gurney);
    const cart = createDetailedTreatmentCart(6.6, 14.1, 0.24);
    scene.add(cart);

    // Vigas y placas alrededor del acceso al pasillo: sustituyen el vano plano por una fachada hospitalaria pesada.
    const steel = new THREE.MeshStandardMaterial({ color: 0x293039, roughness: 0.46, metalness: 0.78 });
    const oxidized = new THREE.MeshStandardMaterial({ color: 0x4a3225, roughness: 0.76, metalness: 0.52 });
    [-3.45, 3.45].forEach(x => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.15, 3.22, 10), steel);
        post.position.set(x, 1.62, 2.34); post.rotation.z = x < 0 ? 0.035 : -0.035; scene.add(post);
        const collar = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.025, 7, 14), oxidized);
        collar.position.set(x, 2.62, 2.34); collar.rotation.x = Math.PI / 2; scene.add(collar);
    });
    for (let x = -2.5; x <= 2.5; x += 1.25) {
        const rib = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.22, 0.34), oxidized);
        rib.position.set(x, 3.36, 2.30); rib.rotation.z = (x / 2.5) * 0.16; scene.add(rib);
    }
}

function createDetailedGurney(x, z, rotation = 0) {
    const g = new THREE.Group();
    const steel = new THREE.MeshStandardMaterial({ color: 0x58666a, roughness: 0.34, metalness: 0.88 });
    const chrome = new THREE.MeshStandardMaterial({ color: 0xa2b4b5, roughness: 0.20, metalness: 0.96 });
    const fabric = new THREE.MeshStandardMaterial({ color: 0x2b3632, roughness: 0.88 });
    const leather = new THREE.MeshStandardMaterial({ color: 0x4b2a20, roughness: 0.72, metalness: 0.05 });
    const rubber = new THREE.MeshStandardMaterial({ color: 0x0a0b0b, roughness: 0.96 });
    const tube = (length, radius, mat) => new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 8), mat);

    const deck = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.105, 2.18, 4, 1, 8), steel);
    deck.position.y = 0.84; g.add(deck);
    const mattress = new THREE.Mesh(new THREE.BoxGeometry(0.77, 0.16, 1.88, 6, 2, 10), fabric);
    mattress.position.set(0, 0.97, -0.03); mattress.rotation.z = -0.025; g.add(mattress);
    const pillow = new THREE.Mesh(new THREE.SphereGeometry(0.29, 12, 8), new THREE.MeshStandardMaterial({ color: 0x87958b, roughness: 0.9 }));
    pillow.scale.set(1.22, 0.28, 0.72); pillow.position.set(0, 1.12, 0.68); g.add(pillow);

    [-0.44, 0.44].forEach(side => {
        const rail = tube(1.55, 0.027, chrome); rail.rotation.x = Math.PI / 2; rail.position.set(side, 1.15, -0.05); g.add(rail);
        [-0.64, 0.0, 0.64].forEach(zp => { const post = tube(0.28, 0.022, chrome); post.position.set(side, 1.02, zp); g.add(post); });
    });
    [-0.54, 0.54].forEach(zp => {
        const endRail = tube(0.86, 0.03, chrome); endRail.rotation.z = Math.PI / 2; endRail.position.set(0, 1.20, zp * 1.85); g.add(endRail);
    });

    [-0.74, 0.74].forEach(zp => [-0.32, 0.32].forEach(side => {
        const leg = tube(0.76, 0.035, steel); leg.position.set(side, 0.38, zp); g.add(leg);
        const fork = tube(0.14, 0.024, steel); fork.rotation.z = Math.PI / 2; fork.position.set(side, 0.075, zp); g.add(fork);
        const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.105, 0.036, 8, 14), rubber);
        wheel.rotation.y = Math.PI / 2; wheel.position.set(side, 0.075, zp); g.add(wheel);
    }));
    const underBrace = tube(0.7, 0.025, steel); underBrace.rotation.z = Math.PI / 2; underBrace.position.set(0, 0.30, 0); g.add(underBrace);
    [-0.36, 0.36].forEach(zp => {
        const strap = new THREE.Mesh(new THREE.BoxGeometry(0.83, 0.025, 0.07), leather); strap.position.set(0, 1.075, zp); g.add(strap);
        const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.035, 0.095), chrome); buckle.position.set(0, 1.095, zp); g.add(buckle);
    });
    const ivPole = tube(1.42, 0.018, chrome); ivPole.position.set(-0.48, 1.67, -0.64); g.add(ivPole);
    const hook = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.016, 6, 12, Math.PI), chrome); hook.rotation.z = Math.PI; hook.position.set(-0.48, 2.37, -0.64); g.add(hook);
    g.position.set(x, 0, z); g.rotation.y = rotation; g.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return g;
}

function createDetailedTreatmentCart(x, z, rotation = 0) {
    const g = new THREE.Group();
    const steel = new THREE.MeshStandardMaterial({ color: 0x505c5d, roughness: 0.32, metalness: 0.9 });
    const tray = new THREE.MeshStandardMaterial({ color: 0x28352f, roughness: 0.56, metalness: 0.45 });
    [[0.0, 0.48], [0.0, 1.05]].forEach(([xp, yp]) => {
        const shelf = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.055, 0.54), tray); shelf.position.set(xp, yp, 0); g.add(shelf);
    });
    [-0.35, 0.35].forEach(sx => [-0.20, 0.20].forEach(sz => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1.05, 8), steel); leg.position.set(sx, 0.53, sz); g.add(leg);
        const caster = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 })); caster.position.set(sx, 0.05, sz); g.add(caster);
    }));
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.022, 6, 12, Math.PI), steel); handle.rotation.z = Math.PI / 2; handle.position.set(0.48, 1.16, 0); g.add(handle);
    for (let i = 0; i < 4; i++) {
        const vial = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.18, 8), new THREE.MeshStandardMaterial({ color: i % 2 ? 0x8a2b2c : 0x4a807b, transparent: true, opacity: 0.75, roughness: 0.2 }));
        vial.position.set(-0.24 + i * 0.15, 1.19, 0.04); g.add(vial);
    }
    g.position.set(x, 0, z); g.rotation.y = rotation; return g;
}

function buildMainEntrance(LW, LH, LZE, lobbyWallMat) {
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x2e3340, roughness: 0.55, metalness: 0.8 });
    const glassShardMat = new THREE.MeshStandardMaterial({
        color: 0x5577bb, transparent: true, opacity: 0.16,
        roughness: 0.05, metalness: 0.5, side: THREE.DoubleSide
    });
    const glassMat = new THREE.MeshStandardMaterial({
        color: 0x7799cc, transparent: true, opacity: 0.28,
        roughness: 0.08, metalness: 0.6, side: THREE.DoubleSide
    });

    const sideW = LW * 0.16;
    const entrW = LW - sideW * 2;

    // Solid flanking walls
    [-entrW / 2 - sideW / 2, entrW / 2 + sideW / 2].forEach(xp => {
        const w = new THREE.Mesh(new THREE.BoxGeometry(sideW, LH, 0.28), lobbyWallMat);
        w.position.set(xp, LH / 2, LZE - 0.14);
        w.castShadow = true; w.receiveShadow = true; scene.add(w);
    });

    // Top header beam
    const doorH = LH * 0.82;
    const topBeam = new THREE.Mesh(new THREE.BoxGeometry(entrW + 0.1, LH - doorH + 0.05, 0.18), frameMat);
    topBeam.position.set(0, doorH + (LH - doorH) / 2, LZE - 0.09); scene.add(topBeam);

    // 4 door panels separated by frame posts
    const numDoors = 4, doorW = entrW / numDoors;
    for (let i = 0; i <= numDoors; i++) {
        const xp = -entrW / 2 + i * doorW;
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.09, doorH + 0.1, 0.18), frameMat);
        post.position.set(xp, doorH / 2, LZE - 0.09); scene.add(post);
    }
    // Horizontal frame rail
    const hRail = new THREE.Mesh(new THREE.BoxGeometry(entrW, 0.09, 0.18), frameMat);
    hRail.position.set(0, doorH, LZE - 0.09); scene.add(hRail);
    // Mid-rail
    const midRail = new THREE.Mesh(new THREE.BoxGeometry(entrW, 0.07, 0.18), frameMat);
    midRail.position.set(0, doorH * 0.45, LZE - 0.09); scene.add(midRail);

    // Broken glass panels (mostly shattered, shards hanging or missing)
    for (let i = 0; i < numDoors; i++) {
        const xc = -entrW / 2 + i * doorW + doorW / 2;
        // Remaining glass shard (random size, tilted)
        if (Math.random() > 0.3) {
            const sw = doorW * (0.25 + Math.random() * 0.35);
            const sh = doorH * (0.12 + Math.random() * 0.28);
            const shard = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), glassShardMat);
            shard.position.set(xc + (Math.random() - 0.5) * doorW * 0.4,
                sh / 2 + Math.random() * doorH * 0.5, LZE - 0.04);
            shard.rotation.z = (Math.random() - 0.5) * 0.7;
            scene.add(shard);
        }
        // Lower pane (some still intact)
        if (Math.random() > 0.5) {
            const lp = new THREE.Mesh(new THREE.PlaneGeometry(doorW * 0.85, doorH * 0.35), glassMat);
            lp.position.set(xc, doorH * 0.2, LZE - 0.04); scene.add(lp);
        }
    }

    // Broken glass on floor near entrance
    const floorGlassMat = new THREE.MeshStandardMaterial({
        color: 0x8899cc, transparent: true, opacity: 0.32, roughness: 0.08, side: THREE.DoubleSide
    });
    for (let i = 0; i < 55; i++) {
        const s = 0.04 + Math.random() * 0.22;
        const g = new THREE.Mesh(new THREE.PlaneGeometry(s, s * 0.3 + Math.random() * s * 0.7), floorGlassMat);
        g.rotation.x = -Math.PI / 2; g.rotation.z = Math.random() * Math.PI;
        g.position.set((Math.random() - 0.5) * LW * 0.75, 0.004, LZE - 5 + Math.random() * 7);
        scene.add(g);
    }

    // "BIENVENIDOS" header sign above entrance
    const bienTex = createTexture(1024, 128, (ctx, w, h) => {
        ctx.fillStyle = 'rgba(5,5,8,0.95)'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(165,145,80,0.92)'; ctx.textAlign = 'center';
        ctx.font = 'bold 52px "Arial Black",Arial,sans-serif';
        ctx.fillText('BIENVENIDOS — ADMISIONES', w / 2, 85);
        ctx.strokeStyle = 'rgba(100,85,40,0.55)'; ctx.lineWidth = 4; ctx.strokeRect(4, 4, w - 8, h - 8);
    });
    const bienSign = new THREE.Mesh(new THREE.PlaneGeometry(entrW - 0.2, 0.62),
        new THREE.MeshStandardMaterial({ map: bienTex, roughness: 0.7, emissive: 0x201400, emissiveIntensity: 0.35 }));
    bienSign.position.set(0, LH * 0.91, LZE - 0.3); scene.add(bienSign);

    // Exterior (dark outside wall visible through entrance)
    const extMat = new THREE.MeshStandardMaterial({ color: 0x080c14, roughness: 1.0 });
    const extWall = new THREE.Mesh(new THREE.PlaneGeometry(LW + 4, LH + 3), extMat);
    extWall.position.set(0, (LH + 3) / 2 - 1, LZE + 0.9);
    // El antiguo exterior se abre para revelar el atrio de vigilia.
    extWall.visible = false; scene.add(extWall);
    const extFloor = new THREE.Mesh(new THREE.PlaneGeometry(LW + 8, 8), new THREE.MeshStandardMaterial({ color: 0x060809, roughness: 1.0 }));
    extFloor.rotation.x = -Math.PI / 2; extFloor.position.set(0, 0, LZE + 4); scene.add(extFloor);
}

function buildWaitingArea(LZS, LZE, LW) {
    const xBase = -LW / 2 + 1.1;
    // Two rows of waiting chairs along west side
    const rows = [
        { x: xBase, zs: LZS + 3.5, count: 3, step: 3.8 },
        { x: xBase + 1.4, zs: LZS + 4, count: 3, step: 3.8 }
    ];
    rows.forEach(row => {
        for (let i = 0; i < row.count; i++) {
            const c = createWaitingChair(row.x, 0, row.zs + i * row.step);
            scene.add(c);
        }
    });

    // A few chairs knocked over / dragged out of place
    for (let i = 0; i < 5; i++) {
        const x = -LW / 2 + 0.8 + Math.random() * 4.5;
        const z = LZS + 2.5 + Math.random() * (LZE - LZS - 7);
        const c = createWaitingChair(x, 0, z);
        c.rotation.y = Math.random() * Math.PI * 2;
        c.rotation.z = (Math.random() - 0.5) * 1.4;
        c.position.y = 0.1 + Math.random() * 0.2;
        scene.add(c);
    }

    // Small side table with old magazines
    const tabMat = new THREE.MeshStandardMaterial({ color: 0x221810, roughness: 0.85 });
    const tabTop = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.04, 0.5), tabMat);
    tabTop.position.set(-LW / 2 + 1.6, 0.5, LZS + 14); tabTop.castShadow = true; scene.add(tabTop);
    const tabLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 8), materials.rustyMetal);
    tabLeg.position.set(-LW / 2 + 1.6, 0.25, LZS + 14); tabLeg.castShadow = true; scene.add(tabLeg);
    // Papers/magazines on table
    for (let i = 0; i < 4; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.008 + i * 0.003, 0.22),
            new THREE.MeshStandardMaterial({ color: 0xb8b098 + i * 0x020200, roughness: 1.0 }));
        p.position.set(-LW / 2 + 1.6 + (Math.random() - 0.5) * 0.35, 0.54 + i * 0.009, LZS + 14 + (Math.random() - 0.5) * 0.2);
        p.rotation.y = (Math.random() - 0.5) * 0.5; p.castShadow = true; scene.add(p);
    }

    // Scattered toys (matching reference image)
    const toyColors = [0xff3311, 0x2244cc, 0xeeaa00, 0x22aa44];
    for (let i = 0; i < 4; i++) {
        const tc = toyColors[i];
        const tm = new THREE.MeshStandardMaterial({ color: tc, roughness: 0.85 });
        let toy;
        if (i === 0) toy = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), tm);
        else if (i === 1) { toy = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.14, 0.22), tm); toy.rotation.y = 0.9; }
        else if (i === 2) toy = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.2, 8), tm);
        else toy = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.16, 8), tm);
        toy.position.set(-LW / 2 + 2 + i * 0.7, 0.09, LZS + 8 + (Math.random() - 0.5) * 2);
        toy.castShadow = true; scene.add(toy);
    }
}

    back.rotation.x = 0.06;

    const legPositions = [[-0.21, -0.2], [0.21, -0.2], [-0.21, 0.2], [0.21, 0.2]];

function checkBoundary(pos) {
    const limitXRight = (HALL_WIDTH / 2) - 0.5;
    const limitXLeftHall = -(HALL_WIDTH / 2) + 0.5;

    // Lobby zone (z > 1.5): wider bounds, prevent walking through side walls
    if (pos.z > 1.5) {
        if (pos.z > 23.5) pos.z = 23.5;
        if (pos.x < -9.5) pos.x = -9.5;
        if (pos.x > 9.5) pos.x = 9.5;
        // Only allow dropping back into hallway through the opening (x within ±HALL_WIDTH/2)
        if (pos.z < 2.1 && Math.abs(pos.x) > HALL_WIDTH / 2 - 0.3) {
            pos.z = 2.1;
        }
        return;
    }

    // Hallway zone
    if (pos.x > limitXRight) pos.x = limitXRight;
    if (pos.z > 1.5) pos.z = 1.5;
    if (pos.z < -HALL_LENGTH + 2) pos.z = -HALL_LENGTH + 2;

    if (pos.x < limitXLeftHall) {
        let inOpenDoorway = null;
        for (const d of doors) {
            if (d.isOpen && pos.z <= d.doorZMax && pos.z >= d.doorZMin) {
                inOpenDoorway = d;
                break;
            }
        }
        if (inOpenDoorway) {
            const b = inOpenDoorway.roomBounds;
            if (pos.x < b.xMin) pos.x = b.xMin;
            if (pos.x > b.xMax) pos.x = b.xMax;
            if (pos.z < b.zMin) pos.z = b.zMin;
            if (pos.z > b.zMax) pos.z = b.zMax;
        } else {
            pos.x = limitXLeftHall;
        }
    }
}

function toggleNearestDoor() {
    if (!nearestDoor) return;
    nearestDoor.isOpen = !nearestDoor.isOpen;
    nearestDoor.targetAngle = nearestDoor.isOpen ? nearestDoor.openAngle : nearestDoor.closedAngle;
    if (nearestDoor.sealMesh) nearestDoor.sealMesh.visible = !nearestDoor.isOpen;
}

function setupInteraction() {
    const interactBtn = document.getElementById('interact-btn');

    if (!isMobile) {
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyE') toggleNearestDoor();
        });
    } else {
        interactBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleNearestDoor();
        }, { passive: false });
    }
}

function updateDoorInteraction() {
    const prompt = document.getElementById('interact-prompt');
    let closest = null;
    let closestDist = DOOR_INTERACT_DIST;

    doors.forEach(d => {
        const dist = camera.position.distanceTo(d.worldPos);
        if (dist < closestDist) {
            closestDist = dist;
            closest = d;
        }
        const diff = d.targetAngle - d.currentAngle;
        if (Math.abs(diff) > 0.001) {
            d.currentAngle += diff * Math.min(1, deltaTime * 5);
            d.doorMesh.rotation.y = d.currentAngle;
        }
        if (d.sealMesh) d.sealMesh.visible = !d.isOpen;
    });

    nearestDoor = closest;
    if (nearestDoor) {
        prompt.style.display = 'block';
        prompt.textContent = nearestDoor.isOpen
            ? `[ E ] CERRAR PUERTA`
            : `[ E ] ABRIR PUERTA`;
    } else {
        prompt.style.display = 'none';
    }
}

function setupMobileControls() {
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    const lookZone = document.getElementById('look-zone');
    let joystickPointer = null;
    let lookPointer = null;

    const resetJoystick = () => {
        joystickPointer = null;
        touchLeftId = null;
        joyCurrentX = 0;
        joyCurrentY = 0;
        joyKnob.style.transform = 'translate(-50%, -50%)';
    };
    const beginJoystick = (e) => {
        e.preventDefault(); e.stopPropagation();
        joystickPointer = e.pointerId;
        touchLeftId = e.pointerId;
        const box = joyZone.getBoundingClientRect();
        // El centro visual y el centro lógico coinciden incluso si cambia el tamaño de pantalla.
        joyStartX = box.left + box.width / 2;
        joyStartY = box.top + box.height / 2;
        joyZone.setPointerCapture?.(e.pointerId);
        updateJoystick(e.clientX, e.clientY, joyKnob);
    };
    const moveJoystick = (e) => {
        if (e.pointerId !== joystickPointer) return;
        e.preventDefault();
        updateJoystick(e.clientX, e.clientY, joyKnob);
    };
    const endJoystick = (e) => {
        if (e.pointerId === joystickPointer) resetJoystick();
    };
    joyZone.addEventListener('pointerdown', beginJoystick, { passive: false });
    joyZone.addEventListener('pointermove', moveJoystick, { passive: false });
    joyZone.addEventListener('pointerup', endJoystick, { passive: false });
    joyZone.addEventListener('pointercancel', endJoystick, { passive: false });
    joyZone.addEventListener('lostpointercapture', resetJoystick);

    const beginLook = (e) => {
        if (e.target !== lookZone) return;
        e.preventDefault();
        lookPointer = e.pointerId;
        touchRightId = e.pointerId;
        lookLastX = e.clientX;
        lookLastY = e.clientY;
        lookZone.setPointerCapture?.(e.pointerId);
    };
    const moveLook = (e) => {
        if (e.pointerId !== lookPointer) return;
        e.preventDefault();
        const deltaX = e.clientX - lookLastX;
        const deltaY = e.clientY - lookLastY;
        yaw -= deltaX * 0.004;
        pitch -= deltaY * 0.004;
        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        lookLastX = e.clientX;
        lookLastY = e.clientY;
    };
    const endLook = (e) => {
        if (e.pointerId === lookPointer) { lookPointer = null; touchRightId = null; }
    };
    lookZone.addEventListener('pointerdown', beginLook, { passive: false });
    lookZone.addEventListener('pointermove', moveLook, { passive: false });
    lookZone.addEventListener('pointerup', endLook, { passive: false });
    lookZone.addEventListener('pointercancel', endLook, { passive: false });
}

function updateJoystick(x, y, knob) {
    let dx = x - joyStartX;
    let dy = y - joyStartY;
    const maxDist = 52;
    const dist = Math.hypot(dx, dy);
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    // Zona muerta: evita que una vibración mínima inmovilice o haga derivar al jugador.
    if (Math.abs(dx) < 4) dx = 0;
    if (Math.abs(dy) < 4) dy = 0;
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joyCurrentX = dx / maxDist;
    joyCurrentY = dy / maxDist;
}

function setupDesktopControls() {
    document.addEventListener('keydown', (e) => {
        switch (e.code) {
            case 'KeyW': moveForward = true; break;
            case 'KeyA': moveLeft = true; break;
            case 'KeyS': moveBackward = true; break;
            case 'KeyD': moveRight = true; break;
        }
    });

    document.addEventListener('keyup', (e) => {
        switch (e.code) {
            case 'KeyW': moveForward = false; break;
            case 'KeyA': moveLeft = false; break;
            case 'KeyS': moveBackward = false; break;
            case 'KeyD': moveRight = false; break;
        }
    });

    const body = document.body;
    const requestPointerLockFn =
        body?.requestPointerLock?.bind(body) ||
        body?.mozRequestPointerLock?.bind(body);

    if (requestPointerLockFn) {
        body.addEventListener('click', () => {
            if (document.getElementById('ui-layer').style.display !== 'none') {
                requestPointerLockFn();
            }
        });
    }

    document.addEventListener('mousemove', (e) => {
        const locked = document.pointerLockElement === body || document.mozPointerLockElement === body;
        if (!requestPointerLockFn || locked) {
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        }
    });
}

function animate() {
    requestAnimationFrame(animate);
    deltaTime = Math.min(0.05, clock.getDelta());

    const moving = direction.length() > 0 || Math.abs(joyCurrentX) > 0.01 || Math.abs(joyCurrentY) > 0.01;
    const walkCycle = clock.elapsedTime * (moving ? 10.5 : 3.0);
    const bobTarget = moving ? Math.sin(walkCycle) * 0.092 : 0;
    const rollTarget = moving ? (-direction.x * 0.08) + Math.sin(walkCycle * 0.7) * 0.024 : 0;
    const shakeTarget = moving ? 0.026 + Math.min(0.014, direction.length() * 0.01) : 0.008;

    cameraBob += (bobTarget - cameraBob) * 0.16;
    cameraRoll += (rollTarget - cameraRoll) * 0.14;
    cameraShake += (shakeTarget - cameraShake) * 0.18;
    cameraSway += (moving ? Math.sin(walkCycle * 1.2) * 0.0035 : 0 - cameraSway * 0.35) * 0.18;

    const headTilt = moving ? Math.sin(walkCycle * 0.8) * 0.03 + cameraShake * 0.1 : 0;
    camera.quaternion.setFromEuler(new THREE.Euler(pitch + headTilt * 0.25, yaw + headTilt * 0.08, cameraRoll + headTilt * 0.16, 'YXZ'));

    direction.z = Number(moveForward) - Number(moveBackward);
    direction.x = Number(moveRight) - Number(moveLeft);

    if (isMobile) {
        direction.z = -joyCurrentY;
        direction.x = joyCurrentX;
    }

    direction.normalize();

    if (direction.length() > 0) {
        const cYaw = Math.cos(yaw);
        const sYaw = Math.sin(yaw);
        const moveX = direction.x * moveSpeed * deltaTime;
        const moveZ = direction.z * moveSpeed * deltaTime;

        const pX = moveX * cYaw - moveZ * sYaw;
        const pZ = -moveX * sYaw - moveZ * cYaw;
        camera.position.x += pX;
        camera.position.z += pZ;

        checkBoundary(camera.position);

        flashlight.position.x = 0.2 + Math.sin(clock.elapsedTime * 4) * 0.08;
        flashlight.position.y = -0.2 + Math.cos(clock.elapsedTime * 4) * 0.07;
        flashlight.angle = Math.PI / 5 + Math.sin(clock.elapsedTime * 6) * 0.01;
    }

    camera.position.y = 1.6 + cameraBob + (moving ? Math.sin(clock.elapsedTime * 18) * 0.01 : Math.sin(clock.elapsedTime * 2) * 0.015);
    camera.position.x += Math.sin(clock.elapsedTime * 6 + yaw) * cameraShake * 0.3;
    camera.position.z += Math.cos(clock.elapsedTime * 5 + yaw) * cameraShake * 0.15;

    lights.forEach(l => {
        if (l.isBroken) {
            const flicker = Math.random();
            if (flicker > 0.965) {
                l.light.intensity = l.baseInt * 1.1;
                if (l.spot) l.spot.intensity = l.spotBase * 1.1;
                if (l.mat) l.mat.emissiveIntensity = 2.2;
            } else if (flicker > 0.9) {
                l.light.intensity = Math.random() * l.baseInt * 0.3;
                if (l.spot) l.spot.intensity = Math.random() * l.spotBase * 0.3;
                if (l.mat) l.mat.emissiveIntensity = 0.2;
            }
        } else if (l.isAccent) {
            // Pulsing colored accent lights for cinematic depth
            const pulse = 0.7 + 0.3 * Math.sin(clock.elapsedTime * 0.4 + l.phase);
            l.light.intensity = l.baseInt * pulse;
        } else if (l.isEmergency) {
            // Emergency strobe lights (slow, menacing blink)
            const blink = Math.sin(clock.elapsedTime * 0.8 + l.phase);
            l.light.intensity = blink > 0.7 ? 3.5 : 0;
        } else if (l.light && l.light.type === 'PointLight') {
            l.light.intensity = l.baseInt + Math.sin(clock.elapsedTime * 1.3 + l.baseInt) * 0.08;
        }
    });

    // Dynamic fog (subtle breathing effect)
    if (scene.fog) {
        const fogPulse = 1.0 + 0.03 * Math.sin(clock.elapsedTime * 0.2);
        scene.fog.density = window._fogBaseDensity * fogPulse;
        // Subtle color shift
        const colorShift = 0.5 + 0.5 * Math.sin(clock.elapsedTime * 0.1);
        scene.fog.color.setRGB(
            0.024 + colorShift * 0.005,
            0.02 + colorShift * 0.003,
            0.028 + colorShift * 0.008
        );
    }

    // Canvas textures, overlays y partículas son decorativos: se actualizan a 20 Hz en modo ligero.
    const updateVisualsThisFrame = !PERFORMANCE_MODE || (++performanceFrame % 3 === 0);
    if (updateVisualsThisFrame) machineDisplays.forEach((item, idx) => {
        const ctx = item.displayCtx;
        const w = item.displayCanvas.width;
        const h = item.displayCanvas.height;
        ctx.clearRect(0, 0, w, h);
        const pulse = 0.45 + 0.3 * Math.sin(clock.elapsedTime * 2.2 + idx);
        const base = idx % 2 === 0 ? '#071018' : '#120b0a';
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, w, h);
        for (let y = 0; y < h; y += 20) {
            ctx.fillStyle = `rgba(255,255,255,${0.03 + pulse * 0.04})`;
            ctx.fillRect(0, y, w, 2);
        }
        ctx.fillStyle = idx % 2 === 0 ? 'rgba(220, 80, 40, 0.95)' : 'rgba(220, 180, 70, 0.95)';
        ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
        ctx.fillText(idx % 2 === 0 ? 'SELECCIÓN' : 'EMERGENCIA', w / 2, h * 0.34);
        ctx.font = 'bold 28px Arial';
        ctx.fillText(idx % 2 === 0 ? 'AUTOMÁTICA' : 'ACTIVA', w / 2, h * 0.58);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillRect(w * 0.1, h * 0.72, w * 0.8, 2);
        ctx.fillStyle = `rgba(255,255,255,${0.25 + pulse * 0.55})`;
        ctx.fillRect(w * 0.15, h * 0.74, w * 0.7 * (0.45 + Math.sin(clock.elapsedTime * 3 + idx) * 0.2), 3);
        item.displayTex.needsUpdate = true;
        item.displayMat.emissiveIntensity = 0.35 + pulse * 0.4;
        if (item.redLight.material) {
            item.redLight.material.emissiveIntensity = 0.2 + pulse * 0.7;
        }
        item.buttonRows.forEach((btn, bi) => {
            const glow = 0.25 + (Math.sin(clock.elapsedTime * 2.2 + bi * 0.4) + 1) * 0.2;
            btn.material.color.setRGB(0.16 + glow * 0.04, 0.16 + glow * 0.04, 0.16 + glow * 0.04);
        });
    });

    if (updateVisualsThisFrame) receptionScreens.forEach((screen, idx) => {
        const ctx = screen.ctx;
        const w = screen.canvas.width;
        const h = screen.canvas.height;
        const pulse = 0.5 + 0.35 * Math.sin(clock.elapsedTime * 1.8 + idx * 0.7);
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#071118'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(120, 180, 220, 0.12)';
        for (let y = 0; y < h; y += 18) ctx.fillRect(0, y, w, 1);
        ctx.fillStyle = `rgba(120, 220, 170, ${0.5 + pulse * 0.3})`;
        ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
        ctx.fillText('PAB. 06', w / 2, h * 0.29);
        ctx.font = 'bold 24px Arial';
        ctx.fillText('ACTIVO', w / 2, h * 0.5);
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(w * 0.12, h * 0.68, w * 0.76, 2);
        ctx.fillStyle = `rgba(255,255,255,${0.25 + pulse * 0.5})`;
        ctx.fillRect(w * 0.14, h * 0.70, w * 0.6 * (0.55 + Math.sin(clock.elapsedTime * 3 + idx) * 0.2), 3);
        screen.texture.needsUpdate = true;
        screen.mesh.material.emissiveIntensity = 0.6 + pulse * 0.25;
        screen.light.material.emissiveIntensity = 0.2 + pulse * 0.75;
    });

    if (updateVisualsThisFrame) {
        updateScreenParticles();
        updateAnimatedObjects();
        updateEnhancedEffects();
        updateEffects(clock.elapsedTime);
    }
    updateDoorInteraction();
    updateTelekinesis(deltaTime);
    updateTKEffects(deltaTime);
    updateHorrorDirector(deltaTime);
    updateEpicVisualPass(clock.elapsedTime);
    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

was sealed by government order — without explanation.

47 patients vanished overnight.
Staff found only silence... and scratch marks on every door.

Investigators who entered the building reported lights
moving by themselves. Objects hurled across rooms.

function startStoryTyping() {
    const el = document.getElementById('story-text');

    el.textContent = '';
    storyTypingIdx = 0;
    function typeNext() {
        if (storyTypingIdx < STORY_TEXT.length) {
            el.textContent += STORY_TEXT[storyTypingIdx++];
            // auto-scroll so text is always visible
            body.scrollTop = body.scrollHeight;
            const ch = STORY_TEXT[storyTypingIdx - 1];
            const delay = ch === '\n' ? 55 : ch === '.' || ch === '?' || ch === '…' ? 110 : 26;
            storyTypingTimer = setTimeout(typeNext, delay);
        } else {
            document.getElementById('story-cursor').style.display = 'none';
            const btn = document.getElementById('story-begin-btn');
