<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hospital Psiquiátrico - Terror Realista</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            touch-action: none;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        #fx-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: radial-gradient(circle at center, transparent 30%, rgba(3,5,10,0.78) 100%);
            mix-blend-mode: multiply;
        }
        #noise-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 11;
            opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        #dirt-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 12;
            opacity: 0.34;
            box-shadow: inset 0 0 220px rgba(0,0,0,1);
        }
        #vignette-flash {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 13;
            background: rgba(120,0,0,0);
            transition: background 0.15s ease;
        }
        #fx-particles {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 14;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.75;
        }
        #interact-prompt {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            color: #eee;
            font-size: 0.95rem;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.55);
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.15);
            display: none;
            text-align: center;
            pointer-events: none;
        }
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: none;
        }
        #ui-layer { touch-action: none; }
        #joystick-zone {
            position: absolute;
            z-index: 5;
            pointer-events: auto;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 70px;
            left: 70px;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #look-zone {
            position: absolute;
            z-index: 4;
            pointer-events: auto;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            touch-action: none;
        }
        #interact-btn {
            position: absolute;
            z-index: 6;
            pointer-events: auto;
            bottom: 55px;
            right: 30px;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.25);
            color: #eee;
            font-size: 0.75rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            touch-action: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #menu-screen {
            position: absolute;
            inset: 0;
            background: #050505;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            color: #ccaa88;
            text-shadow: 0 0 10px #000;
            letter-spacing: 2px;
            margin: 0 0 14px;
        }
        p {
            font-size: 1rem;
            color: #888;
            max-width: 80%;
            line-height: 1.5;
            margin: 0 0 20px;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
        }
        #start-btn:hover {
            background: #333;
            border-color: #fff;
        }

        /* ── Animated film grain ───────────────────────────────────────────── */
        @keyframes grainShift {
            0%   { transform: translate(0,0)     scale(1.05); }
            20%  { transform: translate(-2%,-1%) scale(1.05); }
            40%  { transform: translate(1%, 2%)  scale(1.05); }
            60%  { transform: translate(2%,-2%)  scale(1.05); }
            80%  { transform: translate(-1%, 1%) scale(1.05); }
            100% { transform: translate(0,0)     scale(1.05); }
        }
        #noise-overlay { animation: grainShift 0.13s steps(1) infinite; }

        /* ── Horizontal scanlines ──────────────────────────────────────────── */
        #scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 9;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px, transparent 3px,
                rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px
            );
        }

        /* ── Heartbeat vignette (updated by JS each frame) ─────────────────── */
        #heartbeat-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 8;
        }

        /* ── Screen glitch overlay ─────────────────────────────────────────── */
        #glitch-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 18;
            opacity: 0;
            background: rgba(0, 200, 80, 0.04);
            mix-blend-mode: screen;
        }
        @keyframes glitchAnim {
            0%, 100% { opacity: 0;   transform: translate(0,0)   skewX(0deg); }
            12%      { opacity: 0.8; transform: translate(-3px,0) skewX(-1.2deg); }
            24%      { opacity: 0.6; transform: translate(3px,1px) skewX(1deg); }
            36%      { opacity: 0.8; transform: translate(-1px,-1px) skewX(-0.4deg); }
            50%      { opacity: 0;   transform: translate(0,0)   skewX(0deg); }
        }
        #glitch-layer.firing { animation: glitchAnim 0.22s steps(1) forwards; }

        /* ── Cinematic letterbox bars ──────────────────────────────────────── */
        #cinematic-bars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 19;
        }
        #cinematic-bars .bar {
            position: absolute;
            left: 0; right: 0;
            background: #000;
            transition: height 0.6s ease;
        }
        #cinematic-bars .top-bar { top: 0; height: 0; }
        #cinematic-bars .bottom-bar { bottom: 0; height: 0; }
        #cinematic-bars.active .top-bar,
        #cinematic-bars.active .bottom-bar {
            height: 8vh;
        }
        /* ── Breathing vignette (subtle) ───────────────────────────────────── */
        #breath-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 7;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.3) 100%);
            opacity: 0.5;
        }
        /* ── Lens flash effect ─────────────────────────────────────────────── */
        #lens-flash {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 17;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        /* ── Chromatic aberration flash on canvas ───────────────────────────── */
        @keyframes caFlash {
            0%, 100% { filter: none; }
            35% { filter: drop-shadow(-2px 0 0 rgba(255,0,0,0.22))
                         drop-shadow(2px 0 0 rgba(0,80,255,0.18)); }
        }
        #game-canvas.ca-flash { animation: caFlash 0.28s ease-out forwards; }

        /* ══════════════════════════════════════════════════════════════════════
           INTRO SCREEN — CRT TV (true 3D CSS)
        ══════════════════════════════════════════════════════════════════════ */
        #intro-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 60%, #0a0a06 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            perspective: 900px;
            overflow: hidden;
        }
        /* subtle whole-screen horror sway */
        @keyframes introShake {
            0%,100% { transform: translate(0,0); }
            20%     { transform: translate(-1px, 0.5px); }
            50%     { transform: translate(1px, -0.5px); }
            75%     { transform: translate(-0.5px, 1px); }
        }
        /* floor shadow */
        #intro-screen::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 35%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            pointer-events: none;
        }
        /* green CRT glow on background */
        #intro-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 55% 40% at 50% 42%, rgba(50,180,30,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── 3D scene container ── */
        .tv-scene {
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(4deg) rotateY(-8deg);
            animation: tvFloat 6s ease-in-out infinite, introShake 0.22s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes tvFloat {
            0%,100% { transform: rotateX(4deg) rotateY(-8deg) translateY(0px); }
            50%      { transform: rotateX(3deg) rotateY(-8deg) translateY(-6px); }
        }

        /* ── Main front face ── */
        .tv-front {
            position: relative;
            width: min(320px, 75vw);
            background: linear-gradient(150deg, #252318 0%, #17160f 55%, #1f1e13 100%);
            border-radius: 14px 14px 16px 16px;
            padding: 18px 18px 24px;
            box-shadow:
                inset 0 3px 6px rgba(255,255,180,0.05),
                inset 0 -3px 6px rgba(0,0,0,0.5),
                0 2px 0 #0a0908;
        }

        /* ── Right side face ── */
        .tv-side-right {
            position: absolute;
            top: 6px;
            right: 0;
            width: 44px;
            height: calc(100% - 12px);
            background: linear-gradient(to right, #111009, #0c0b07);
            border-radius: 0 10px 10px 0;
            transform: rotateY(-90deg) translateZ(-1px);
            transform-origin: right center;
            box-shadow: inset -2px 0 8px rgba(0,0,0,0.6);
        }
        .tv-side-right::after {
            content: '';
            position: absolute;
            inset: 10px 6px;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.025) 0px,
                rgba(255,255,255,0.025) 1px,
                transparent 1px,
                transparent 5px
            );
            border-radius: 4px;
        }

        /* ── Top face ── */
        .tv-top {
            position: absolute;
            top: 0; left: 6px;
            width: calc(100% - 12px);
            height: 28px;
            background: linear-gradient(to bottom, #2a2918, #1a1910);
            border-radius: 14px 14px 0 0;
            transform: rotateX(90deg);
            transform-origin: top center;
        }

        /* ── Bottom shadow plane ── */
        .tv-shadow {
            position: absolute;
            bottom: -18px;
            left: 5%;
            width: 90%;
            height: 18px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, transparent 70%);
            transform: rotateX(90deg) translateZ(-2px);
            transform-origin: bottom center;
            filter: blur(6px);
        }

        /* ── Screen recess ── */
        .tv-screen-well {
            background: #05060a;
            border-radius: 10px;
            padding: 5px;
            box-shadow:
                inset 0 0 22px rgba(0,0,0,0.95),
                inset 0 0 4px rgba(255,220,80,0.05),
                0 0 0 2px #0d0d09;
        }
        .tv-screen {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: radial-gradient(ellipse at 48% 38%, #071a04 0%, #020b01 65%, #000 100%);
            border-radius: 6px;
            overflow: hidden;
        }
        /* CRT curved glare */
        .tv-screen::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 55% at 38% 28%, rgba(255,255,255,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 4;
            border-radius: 6px;
        }
        /* scanlines */
        .tv-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px, transparent 2px,
                rgba(0,0,0,0.22) 2px, rgba(0,0,0,0.22) 3px
            );
            pointer-events: none;
            z-index: 3;
        }
        .tv-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            gap: 5px;
        }
        .tv-static {
            position: absolute;
            inset: -5%;
            z-index: 1;
            opacity: 0.09;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            animation: staticAnim 0.08s steps(1) infinite;
        }
        @keyframes staticAnim {
            0%  { transform: translate(0,0) scale(1.05); }
            25% { transform: translate(-2%,-1%) scale(1.05); }
            50% { transform: translate(2%,2%) scale(1.05); }
            75% { transform: translate(-1%,2%) scale(1.05); }
        }
        .tv-title {
            font-family: 'Courier New', monospace;
            font-size: clamp(0.8rem, 3.2vw, 1.25rem);
            color: #72f055;
            text-shadow: 0 0 10px rgba(90,255,60,0.9), 0 0 28px rgba(60,200,40,0.5);
            letter-spacing: 3px;
            text-align: center;
            text-transform: uppercase;
            animation: tvFlicker 5s steps(1) infinite;
            line-height: 1.4;
        }
        .tv-subtitle {
            font-family: 'Courier New', monospace;
            font-size: clamp(0.42rem, 1.5vw, 0.62rem);
            color: rgba(100,240,70,0.5);
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
        }
        .tv-year {
            font-family: 'Courier New', monospace;
            font-size: clamp(0.48rem, 2vw, 0.78rem);
            color: rgba(70,210,50,0.65);
            letter-spacing: 5px;
            margin-top: 6px;
            animation: blink 1.2s step-end infinite;
        }
        @keyframes blink    { 0%,100%{opacity:1;} 50%{opacity:0;} }
        @keyframes tvFlicker {
            0%,94%,97%,100% { opacity: 1; }
            95%              { opacity: 0.08; }
            96%              { opacity: 0.5; }
        }

        /* ── Knob panel on right side of front ── */
        .tv-knobs {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .tv-knob {
            width: 13px;
            height: 13px;
            background: radial-gradient(circle at 32% 30%, #3a3826, #0d0d09);
            border-radius: 50%;
            box-shadow:
                0 2px 5px rgba(0,0,0,0.9),
                inset 0 1px 2px rgba(255,255,180,0.07),
                0 0 0 1px #2a2818;
        }
        .tv-knob::after {
            content: '';
            display: block;
            width: 3px;
            height: 3px;
            background: #555;
            border-radius: 50%;
            margin: 5px auto 0;
        }

        /* ── Antennas ── */
        .tv-antennas {
            position: absolute;
            bottom: 100%;
            left: 0; right: 0;
            height: 70px;
            pointer-events: none;
        }
        .tv-ant {
            position: absolute;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to top, #2e2c1c, #1a1910 60%, #111 100%);
            border-radius: 2px 2px 0 0;
            box-shadow: 1px 0 3px rgba(0,0,0,0.5);
        }
        .tv-ant-l { left: 28%; height: 55px; transform: rotate(-24deg); transform-origin: bottom center; }
        .tv-ant-r { right: 28%; height: 65px; transform: rotate(18deg);  transform-origin: bottom center; }
        /* small ball at tip */
        .tv-ant::after {
            content: '';
            position: absolute;
            top: -3px; left: -2px;
            width: 7px; height: 7px;
            background: #222;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
        }

        /* ── Legs ── */
        .tv-legs {
            display: flex;
            justify-content: space-around;
            width: 55%;
            margin: 0 auto;
            transform-style: preserve-3d;
        }
        .tv-leg {
            width: 12px;
            height: 22px;
            background: linear-gradient(to bottom, #1e1d12, #0c0c08);
            border-radius: 0 0 4px 4px;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.7), inset 1px 0 2px rgba(255,255,180,0.03);
        }

        /* ── Screen glow around TV ── */
        .tv-glow {
            position: absolute;
            top: 10%; left: 5%;
            width: 90%; height: 80%;
            background: radial-gradient(ellipse at 50% 45%, rgba(60,220,40,0.12) 0%, transparent 68%);
            pointer-events: none;
            filter: blur(12px);
        }

        /* ── Below-TV text ── */
        .intro-welcome {
            font-family: 'Courier New', monospace;
            font-size: clamp(1.5rem, 5.5vw, 2.6rem);
            color: #ddd8c2;
            letter-spacing: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(190,170,110,0.35);
            margin-top: 14px;
        }
        .intro-sub {
            font-family: 'Courier New', monospace;
            font-size: clamp(0.5rem, 1.8vw, 0.75rem);
            color: #444;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        #intro-continue-btn {
            margin-top: 22px;
            padding: 13px 42px;
            font-family: 'Courier New', monospace;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            background: transparent;
            color: #c0baa8;
            border: 1px solid #3e3928;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulseBorder 2.5s ease-in-out infinite;
        }
        #intro-continue-btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: #999;
            color: #fff;
        }
        @keyframes pulseBorder {
            0%,100% { border-color: #3e3928; box-shadow: none; }
            50%      { border-color: #706848; box-shadow: 0 0 12px rgba(170,150,70,0.12); }
        }

        /* ══════════════════════════════════════════════════════════════════════
           STORY SCREEN — full screen typewriter
        ══════════════════════════════════════════════════════════════════════ */
        #story-screen {
            position: absolute;
            inset: 0;
            background: #000;
            display: none;
            flex-direction: column;
            z-index: 190;
            overflow: hidden;
        }
        /* top vignette */
        #story-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 120px;
            background: linear-gradient(to bottom, #000 0%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }
        /* bottom vignette */
        #story-screen::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 140px;
            background: linear-gradient(to top, #000 0%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }
        .story-header {
            flex-shrink: 0;
            padding: 36px 8vw 0;
            z-index: 3;
        }
        .story-date {
            font-family: 'Courier New', monospace;
            font-size: clamp(0.6rem, 1.8vw, 0.78rem);
            color: #4a2e1a;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(80,50,25,0.35);
            padding-bottom: 14px;
        }
        .story-body {
            flex: 1;
            overflow-y: auto;
            padding: 28px 8vw 80px;
            z-index: 3;
            scrollbar-width: none;
        }
        .story-body::-webkit-scrollbar { display: none; }
        #story-text {
            font-family: 'Courier New', monospace;
            font-size: clamp(0.85rem, 2.2vw, 1.05rem);
            color: #b0a090;
            line-height: 2;
            white-space: pre-wrap;
            max-width: 700px;
        }
        #story-cursor {
            display: inline-block;
            width: 9px;
            height: 1.05em;
            background: #a09080;
            vertical-align: text-bottom;
            animation: blink 0.75s step-end infinite;
        }
        .story-footer {
            flex-shrink: 0;
            padding: 0 8vw 32px;
            z-index: 3;
            display: flex;
            align-items: center;
            min-height: 80px;
        }
        #story-begin-btn {
            display: none;
            padding: 14px 52px;
            font-family: 'Courier New', monospace;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            background: transparent;
            color: #c8a050;
            border: 1px solid #5e3e18;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulseBorder 2s ease-in-out infinite;
        }

<script>

let scene, camera, renderer, clock, deltaTime;
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let direction = new THREE.Vector3();
let moveSpeed = 3.0;
let pitch = 0, yaw = 0;
// Detección robusta: algunos iPad y navegadores modernos no incluyen "iPhone/iPad" en el agente de usuario.
let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches;
let touchLeftId = null, touchRightId = null;
let joyStartX = 0, joyStartY = 0, joyCurrentX = 0, joyCurrentY = 0;
let lookLastX = 0, lookLastY = 0;
let cameraRoll = 0;
let cameraBob = 0;
let cameraShake = 0;
let cameraSway = 0;

let lights = [];
let flashlight;
let doors = [];
let machineDisplays = [];
let receptionScreens = [];
let nearestDoor = null;
let materials = {};
let ghostLights = [];
let glitchTimer = 12;
let heartbeatEl;
// Perfil ligero: prioriza una experiencia fluida en equipos y navegadores modestos.
const PERFORMANCE_MODE = true;
// Capa épica: refuerza el aspecto con geometría y luz barata, sin reactivar sombras ni filtros pesados.
const EPIC_VISUALS = true;
let performanceFrame = 0;
let epicAccents = [];

const HALL_WIDTH = 6;
const WALL_HEIGHT = 3.5;
const HALL_LENGTH = 60;
const DOOR_INTERACT_DIST = 1.8;
const ROOM_DEPTH = 5.8;
const ROOM_WIDTH = 4.8;

const ROOM_DATA = [
    { num: '203', label: 'CIRUGÍA' },
    { num: '204', label: 'PSIQUIATRÍA' },
    { num: '205', label: 'AISLAMIENTO' },
    { num: '206', label: 'MORGUE' },
    { num: '207', label: 'ARCHIVO' },
    { num: '208', label: 'RADIOLOGÍA' },
    { num: '209', label: 'FARMACIA' },
    { num: '210', label: 'PABELLÓN C' }
];

// ═══════════════════════════════════════════════════════════════════════════
// SPECIAL EFFECTS — heartbeat, blood drips, ghost lights, glitch
// ═══════════════════════════════════════════════════════════════════════════

function initEffects() {
    heartbeatEl = document.getElementById('heartbeat-vignette');

    // ── Ghost / atmosphere lights (very dim wandering colours) ────────────
    const ghostColors = [0x003344, 0x1a0005, 0x100018];
    ghostColors.forEach((col, i) => {
        const gl = new THREE.PointLight(col, 3.5, 13);
        gl.position.set(
            (Math.random() - 0.5) * HALL_WIDTH * 0.6,
            1.4 + Math.random() * 1.4,
            -6 - Math.random() * (HALL_LENGTH - 12)
        );
        scene.add(gl);
        ghostLights.push({
            light: gl,
            bx: gl.position.x, by: gl.position.y, bz: gl.position.z,
            ph: Math.random() * Math.PI * 2,
            sp: 0.10 + Math.random() * 0.09
        });
    });
}

function updateEffects(t) {
    // ── Ghost lights ──────────────────────────────────────────────────────
    ghostLights.forEach(g => {
        g.light.position.x = g.bx + Math.sin(t * g.sp + g.ph)       * 0.9;
        g.light.position.y = g.by + Math.cos(t * g.sp * 0.6 + g.ph) * 0.35;
        g.light.position.z = g.bz + Math.sin(t * g.sp * 0.4 + g.ph * 1.4) * 2.2;
        g.light.intensity  = 2.2 + Math.sin(t * g.sp * 2.2 + g.ph)  * 1.0;
    });

    // ── Heartbeat vignette (LUB-DUB at ~60 bpm = 1.0 s period) ──────────
    const hbT   = t % 1.0;
    let   pulse = 0;
    if      (hbT < 0.07)  pulse = hbT / 0.07;
    else if (hbT < 0.15)  pulse = 1 - (hbT - 0.07) / 0.08;
    else if (hbT < 0.26)  pulse = (hbT - 0.15) / 0.11 * 0.55;
    else if (hbT < 0.36)  pulse = 0.55 - (hbT - 0.26) / 0.10 * 0.55;
    const hbAlpha = pulse * 0.30;
    heartbeatEl.style.background =
        `radial-gradient(ellipse 100% 80% at 50% 50%, transparent 30%, rgba(70,0,0,${hbAlpha}) 100%)`;

    // ── Random screen glitch ──────────────────────────────────────────────
    glitchTimer -= deltaTime;
    if (glitchTimer <= 0) {
        glitchTimer = 9 + Math.random() * 14;
        const glitchEl = document.getElementById('glitch-layer');
        glitchEl.classList.remove('firing');
        void glitchEl.offsetWidth; // force reflow to restart animation
        glitchEl.classList.add('firing');
        const cvs = document.getElementById('game-canvas');
        cvs.classList.remove('ca-flash');
        void cvs.offsetWidth;
        cvs.classList.add('ca-flash');
    }
}

function createEpicVisualPass() {
    if (!EPIC_VISUALS) return;

    // Materiales más húmedos y contrastados: un cambio visible con coste de una sola pasada de material.
    if (materials.floor) {
        materials.floor.roughness = 0.58;
        materials.floor.metalness = 0.14;
        materials.floor.normalMap = materials.floor.normalMap || null;
    }
    [materials.rightWall, materials.leftWall, materials.ceiling].forEach(mat => {
        if (mat) { mat.roughness = Math.min(mat.roughness ?? 0.9, 0.78); mat.needsUpdate = true; }
    });

    const skyFill = new THREE.HemisphereLight(0x31536f, 0x130408, 0.6);
    scene.add(skyFill);

    // Conos translúcidos y reflejos en el suelo sustituyen a sombras costosas y dan una iluminación teatral.
    const shaftMat = (color) => new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.075, depthWrite: false,
        blending: THREE.AdditiveBlending, side: THREE.DoubleSide
    });
    const reflectionMat = (color) => new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.13, depthWrite: false,
        blending: THREE.AdditiveBlending, side: THREE.DoubleSide
    });
    const accents = [
        { x: 0, z: -8, color: 0x437fc6, phase: 0.0 },
        { x: 0.8, z: -25, color: 0x6a4ea4, phase: 1.4 },
        { x: -0.7, z: -42, color: 0xb34135, phase: 2.7 },
        { x: 2.0, z: 14, color: 0x8a5d2a, phase: 3.5 }
    ];
    accents.forEach(({x, z, color, phase}) => {
        const shaft = new THREE.Mesh(new THREE.ConeGeometry(1.45, 4.8, 16, 1, true), shaftMat(color));
        shaft.position.set(x, 1.25, z);
        shaft.rotation.x = Math.PI;
        scene.add(shaft);
        const reflection = new THREE.Mesh(new THREE.CircleGeometry(1.7, 24), reflectionMat(color));
        reflection.rotation.x = -Math.PI / 2;
        reflection.scale.set(1.75, 0.72, 1);
        reflection.position.set(x, 0.018, z);
        scene.add(reflection);
        epicAccents.push({ shaft, reflection, phase, base: 0.075 });
    });

    scene.fog.color.setRGB(0.018, 0.026, 0.038);
    window._fogBaseDensity = 0.036;
    renderer.toneMappingExposure = 0.86;
}

function updateEpicVisualPass(t) {
    if (!EPIC_VISUALS) return;
    epicAccents.forEach(item => {
        const pulse = 0.68 + Math.sin(t * 1.15 + item.phase) * 0.22 + Math.sin(t * 2.7 + item.phase) * 0.10;
        item.shaft.material.opacity = Math.max(0.028, item.base * pulse);
        item.reflection.material.opacity = Math.max(0.04, 0.12 * pulse);
        item.reflection.rotation.z = Math.sin(t * 0.22 + item.phase) * 0.06;
    });
}

function init() {
    const canvas = document.getElementById('game-canvas');

    renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: !PERFORMANCE_MODE,
        powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(PERFORMANCE_MODE ? 1 : Math.min(window.devicePixelRatio, 2));
    renderer.physicallyCorrectLights = !PERFORMANCE_MODE;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = PERFORMANCE_MODE ? 0.86 : 1.02;
    // La sombra suave de una linterna a 2048 px es el principal coste por fotograma.
    renderer.shadowMap.enabled = !PERFORMANCE_MODE;
    renderer.shadowMap.type = THREE.BasicShadowMap;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020203);
    scene.fog = new THREE.FogExp2(0x060507, 0.042);
    // Dynamic fog control
    window._fogBaseDensity = 0.042;
    window._fogTargetDensity = 0.042;
    window._fogBaseColor = new THREE.Color(0x060507);

    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 12);
    // La cámara inicia mirando hacia el pasillo; arrastrar el joystick hacia arriba avanza de forma natural.
    yaw = 0;

    clock = new THREE.Clock();

    const ambientLight = new THREE.AmbientLight(0x1a2025, 0.22);
    scene.add(ambientLight);

    const fillLight = new THREE.PointLight(0x233446, 1.10, 20);
    fillLight.position.set(0, 2.4, -10);
    scene.add(fillLight);
    lights.push({ light: fillLight, mat: null, baseInt: 1.55, isBroken: false });

    // Atmospheric colored accent lights (cinematic depth)
    const accentColors = [0x1a3a5c, 0x3a1a5c, 0x1a5c3a, 0x5c3a1a];
    const accentPositions = [
        { x: 2, z: -20 },
        { x: -2, z: -35 },
        { x: 2, z: -50 },
        { x: -1, z: -8 }
    ];
    accentPositions.forEach((pos, i) => {
        const accent = new THREE.PointLight(accentColors[i], 1.2, 12);
        accent.position.set(pos.x, 1.5, pos.z);
        scene.add(accent);
        lights.push({
            light: accent,
            mat: null,
            baseInt: 1.2,
            isBroken: false,
            isAccent: true,
            phase: i * 1.5
        });
    });

    // Emergency strobe lights (red, intermittent)
    const emergencyPositions = [
        { x: 2.5, z: -15 },
        { x: -2.5, z: -40 }
    ];
    emergencyPositions.forEach((pos, i) => {
        const emLight = new THREE.PointLight(0xff2222, 0, 8);
        emLight.position.set(pos.x, WALL_HEIGHT - 0.3, pos.z);
        scene.add(emLight);
        lights.push({
            light: emLight,
            mat: null,
            baseInt: 0,
            isBroken: false,
            isEmergency: true,
            phase: i * Math.PI
        });
    });

    flashlight = new THREE.SpotLight(0xfff5e6, 15.5, 24, Math.PI / 5.5, 0.68, 1.7);
    flashlight.position.set(0.2, -0.2, 0);
    flashlight.target.position.set(0, 0, -1);
    flashlight.castShadow = !PERFORMANCE_MODE;
    flashlight.shadow.mapSize.width = PERFORMANCE_MODE ? 512 : 2048;
    flashlight.shadow.mapSize.height = PERFORMANCE_MODE ? 512 : 2048;
    flashlight.shadow.bias = -0.0005;
    camera.add(flashlight);
    camera.add(flashlight.target);

    // Soft outer flashlight cone (fill light)
    const flashlightOuter = new THREE.SpotLight(0xffeedd, 3.4, 17, Math.PI / 3.7, 0.84, 2);
    flashlightOuter.position.set(0.2, -0.2, 0);
    flashlightOuter.target.position.set(0, 0, -1);
    camera.add(flashlightOuter);
    camera.add(flashlightOuter.target);
    window._flashlightOuter = flashlightOuter;

    scene.add(camera);

    createDust();
    generateMaterials();
    setupScreenParticles();
    buildDetailedHallway();
    buildLobby();
    buildHospitalExpansion();
    buildRealismArchitecturePass();
    initEffects();
    createEpicVisualPass();

    // ── Create spark systems on broken lights ──────────────────────────
    lights.forEach(l => {
        if (l.isBroken && l.light) {
            createSparkSystem(
                l.light.position.x,
                l.light.position.y,
                l.light.position.z
            );
        }
    });

    // ── Volumetric flashlight cone (simulated light shaft) ─────────────
    createVolumetricLight();

    // ── Animated ambient objects ───────────────────────────────────────
    createAnimatedObjects();

    // ── Enhanced post-processing effects ───────────────────────────────
    createEnhancedEffects();
    applyPerformanceMode();

    // ── Survival-horror director: objectives, manifestations and blackout ─
    initHorrorExpansion();
    initCorridorStalker();

    window.addEventListener('resize', onWindowResize, false);
    if (isMobile) setupMobileControls();
    else {
        setupDesktopControls();
        document.getElementById('tk-btn').style.display = 'none';
    }
    setupInteraction();
    animate();
}

function createTexture(width, height, drawFunction) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    drawFunction(ctx, width, height);
    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = PERFORMANCE_MODE ? 1 : renderer.capabilities.getMaxAnisotropy();
    return tex;
}

function drawDirt(ctx, w, h, amount) {
    for (let i = 0; i < amount; i++) {
        ctx.fillStyle = `rgba(10, 10, 5, ${Math.random() * 0.1})`;
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 20 + 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawPeelingPaint(ctx, w, h) {
    for (let i = 0; i < 70; i++) {
        ctx.fillStyle = `rgba(30, 25, 20, ${0.15 + Math.random() * 0.25})`;
        ctx.beginPath();
        const startX = Math.random() * w;
        const startY = Math.random() * h;
        ctx.moveTo(startX, startY);
        for (let j = 0; j < 6; j++) {
            ctx.lineTo(startX + (Math.random() - 0.5) * 120, startY + (Math.random() - 0.5) * 120);
        }
        ctx.closePath();
        ctx.fill();
    }
    for (let i = 0; i < 12; i++) {
        ctx.fillStyle = `rgba(120, 115, 100, ${0.2 + Math.random() * 0.2})`;
        const sx = Math.random() * w, sy = Math.random() * h;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        for (let j = 0; j < 7; j++) {
            ctx.lineTo(sx + (Math.random() - 0.5) * 90, sy + (Math.random() - 0.5) * 90);
        }
        ctx.closePath();
        ctx.fill();
    }
}

function drawRustStreak(ctx, x, y, len, wid) {
    const grad = ctx.createLinearGradient(x, y, x, y + len);
    grad.addColorStop(0, 'rgba(90, 55, 20, 0.5)');
    grad.addColorStop(0.7, 'rgba(60, 40, 15, 0.25)');
    grad.addColorStop(1, 'rgba(40, 30, 15, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - wid / 2, y);
    ctx.quadraticCurveTo(x + (Math.random() - 0.5) * wid, y + len * 0.5, x + (Math.random() - 0.5) * wid * 0.6, y + len);
    ctx.lineTo(x + wid / 2 + (Math.random() - 0.5) * wid * 0.6, y + len);
    ctx.quadraticCurveTo(x + (Math.random() - 0.5) * wid, y + len * 0.5, x + wid / 2, y);
    ctx.closePath();
    ctx.fill();
}

function drawSprayText(ctx, text, x, y, size, options) {
    options = options || {};
    const color = options.color || 'rgba(8,8,8,0.88)';
    const tilt = options.tilt !== undefined ? options.tilt : (Math.random() - 0.5) * 0.06;
    const jitter = options.jitter !== undefined ? options.jitter : size * 0.045;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.font = `bold ${size}px "Arial Black", Arial, sans-serif`;
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = color;

    let cursorX = 0;
    for (let pass = 0; pass < 2; pass++) {
        cursorX = 0;
        const passAlpha = pass === 0 ? 1 : 0.35;
        for (const ch of text) {
            const w = ctx.measureText(ch).width;
            const dx = (Math.random() - 0.5) * jitter * (pass === 0 ? 1 : 2.2);
            const dy = (Math.random() - 0.5) * jitter * (pass === 0 ? 1 : 2.2);
            ctx.globalAlpha = passAlpha * (0.75 + Math.random() * 0.25);
            ctx.save();
            ctx.translate(cursorX + dx, dy);
            ctx.rotate((Math.random() - 0.5) * 0.05);
            ctx.fillText(ch, 0, 0);
            ctx.restore();
            cursorX += w + size * 0.02;
        }
    }

    ctx.globalAlpha = 1;
    cursorX = 0;
    for (const ch of text) {
        const w = ctx.measureText(ch).width;
        if (Math.random() > 0.62 && ch !== ' ') {
            const dripX = cursorX + w * (0.3 + Math.random() * 0.4);
            const dripLen = size * (0.15 + Math.random() * 0.5);
            const dripGrad = ctx.createLinearGradient(dripX, 0, dripX, dripLen);
            dripGrad.addColorStop(0, color);
            dripGrad.addColorStop(1, 'rgba(8,8,8,0)');
            ctx.fillStyle = dripGrad;
            ctx.fillRect(dripX, -2, size * 0.035, dripLen);
        }
        cursorX += w + size * 0.02;
    }
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = color;
    for (let i = 0; i < 25; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * cursorX, (Math.random() - 0.5) * size * 1.4, Math.random() * 3 + 0.5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return cursorX;
}

function generateMaterials() {

        const sheen = ctx.createLinearGradient(0, 0, w, h);

        sheen.addColorStop(1, 'rgba(140,150,160,0.04)');
        ctx.fillStyle = sheen;
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i <= w; i += 160) {

            ctx.moveTo(i + (Math.random() - 0.5) * 6, 0);
            ctx.lineTo(i + (Math.random() - 0.5) * 6, h);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i + (Math.random() - 0.5) * 6);
            ctx.lineTo(w, i + (Math.random() - 0.5) * 6);
            ctx.stroke();
        }
        for (let i = 0; i < 5; i++) {
            const bx = Math.floor(Math.random() * 12) * 160 + 10;

            ctx.fillStyle = 'rgba(4,4,4,0.12)';
            ctx.beginPath();
            ctx.moveTo(bx, by);
            for (let j = 0; j < 7; j++) ctx.lineTo(bx + Math.random() * 120, by + Math.random() * 120);
            ctx.closePath();
            ctx.fill();
        }
        for (let i = 0; i < 10; i++) {
            ctx.strokeStyle = 'rgba(3,3,3,0.55)';

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            for (let j = 0; j < 5; j++) {
                cx += (Math.random() - 0.5) * 90;
                cy += (Math.random() - 0.5) * 90;

            }
            ctx.stroke();
        }
        for (let i = 0; i < 7; i++) {
            const mx = Math.random() * w, my = Math.random() * h, mr = 70 + Math.random() * 180;
            const grad = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
            grad.addColorStop(0, 'rgba(18, 4, 4, 0.5)');

            grad.addColorStop(1, 'rgba(18, 4, 4, 0)');

            ctx.beginPath();
            ctx.arc(mx, my, mr, 0, Math.PI * 2);

        for (let i = 0; i < 5; i++) {

    floorTex.wrapS = THREE.RepeatWrapping;

        }
        for (let i = 0; i < 4; i++) {
            ctx.strokeStyle = 'rgba(0,0,0,0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            let sx = Math.random() * w, sy = Math.random() * h;
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + (Math.random() - 0.5) * 80, sy + (Math.random() - 0.5) * 40);
            ctx.stroke();
        }
    });
    materials.mattress = new THREE.MeshStandardMaterial({ map: mattressTex, roughness: 1.0 });

    const sheetTex = createTexture(256, 256, (ctx, w, h) => {
        ctx.fillStyle = '#5c5c56';
        ctx.fillRect(0, 0, w, h);
        drawDirt(ctx, w, h, 500);
        for (let i = 0; i < 3; i++) {
            const grad = ctx.createRadialGradient(Math.random() * w, Math.random() * h, 0, Math.random() * w, Math.random() * h, 40);
            grad.addColorStop(0, 'rgba(20,15,10,0.4)');
            grad.addColorStop(1, 'rgba(20,15,10,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
        }
    });
    materials.sheet = new THREE.MeshStandardMaterial({ map: sheetTex, roughness: 0.95, side: THREE.DoubleSide });
}

function buildDetailedHallway() {
    const floorGeo = new THREE.PlaneGeometry(HALL_WIDTH, HALL_LENGTH);
    const floor = new THREE.Mesh(floorGeo, materials.floor);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -HALL_LENGTH / 2);
    floor.receiveShadow = true;
    scene.add(floor);

    const ceilGeo = new THREE.PlaneGeometry(HALL_WIDTH, HALL_LENGTH);
    const ceiling = new THREE.Mesh(ceilGeo, materials.ceiling);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, WALL_HEIGHT, -HALL_LENGTH / 2);
    ceiling.receiveShadow = true;
    scene.add(ceiling);

    const rightWallGeo = new THREE.PlaneGeometry(HALL_LENGTH, WALL_HEIGHT);
    const rightWall = new THREE.Mesh(rightWallGeo, materials.rightWall);
    rightWall.rotation.y = -Math.PI / 2;
    rightWall.position.set(HALL_WIDTH / 2, WALL_HEIGHT / 2, -HALL_LENGTH / 2);
    rightWall.receiveShadow = true;
    scene.add(rightWall);

    let zPos = 0;
    let doorIndex = 0;
    while (zPos > -HALL_LENGTH) {
        if (Math.abs(zPos) % 8 === 4) {
            createDetailedDoor(-HALL_WIDTH / 2, zPos, doorIndex % ROOM_DATA.length);
            doorIndex++;
        } else {
            const segGeo = new THREE.PlaneGeometry(4, WALL_HEIGHT);
            const segWall = new THREE.Mesh(segGeo, materials.leftWall);
            segWall.rotation.y = Math.PI / 2;
            segWall.position.set(-HALL_WIDTH / 2, WALL_HEIGHT / 2, zPos);
            segWall.receiveShadow = true;
            scene.add(segWall);
        }
        zPos -= 4;
    }

    createHospitalBed(HALL_WIDTH / 2 - 1.35, -6);
    createHospitalBed(HALL_WIDTH / 2 - 1.5, -18);
    createHospitalBed(HALL_WIDTH / 2 - 1.4, -30);
    createHospitalBed(HALL_WIDTH / 2 - 1.45, -50);

    createWheelchair(1, -25);
    createWheelchair(-1, -35);
    createWheelchair(0.5, -47);
    createWheelchair(-1.2, -56);

    createDebris();

    for (let z = -3; z > -HALL_LENGTH; z -= 7) {
        createWallSconce(-HALL_WIDTH / 2, z);
        createWallSconce(HALL_WIDTH / 2, z);
    }

    // Pared del fondo del pasillo
    const endWallGeo = new THREE.PlaneGeometry(HALL_WIDTH, WALL_HEIGHT);
    const endWall = new THREE.Mesh(endWallGeo, materials.leftWall);
    endWall.position.set(0, WALL_HEIGHT / 2, -HALL_LENGTH + 0.05);
    endWall.receiveShadow = true;
    scene.add(endWall);

    // Pared lateral izquierda al fondo (sin puertas) — tramo final
    const endLeftGeo = new THREE.PlaneGeometry(8, WALL_HEIGHT);
    const endLeftWall = new THREE.Mesh(endLeftGeo, materials.leftWall);
    endLeftWall.rotation.y = Math.PI / 2;
    endLeftWall.position.set(-HALL_WIDTH / 2, WALL_HEIGHT / 2, -HALL_LENGTH + 4);
    endLeftWall.receiveShadow = true;
    scene.add(endLeftWall);
}

// Arquitectura repetible con escala hospitalaria: paneles, pasamanos, infraestructura de techo y zonas húmedas.
function buildRealismArchitecturePass() {
    const paint = new THREE.MeshStandardMaterial({ color: 0x49504c, roughness: 0.83, metalness: 0.04 });
    const darkPaint = new THREE.MeshStandardMaterial({ color: 0x202824, roughness: 0.76, metalness: 0.13 });
    const steel = new THREE.MeshStandardMaterial({ color: 0x485457, roughness: 0.34, metalness: 0.88 });
    const rubber = new THREE.MeshStandardMaterial({ color: 0x151817, roughness: 0.94 });
    const diffuser = new THREE.MeshStandardMaterial({ color: 0xb8d8d3, emissive: 0x3e6c65, emissiveIntensity: 0.72, roughness: 0.40 });
    const wet = new THREE.MeshStandardMaterial({ color: 0x122021, transparent: true, opacity: 0.44, roughness: 0.10, metalness: 0.35, depthWrite: false, side: THREE.DoubleSide });
    const tube = (len, r, mat) => new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat);

    // Zócalos, protectores de pared y pasamanos; hacen que el pasillo tenga una modulación de edificio real.
    [-1, 1].forEach(side => {
        const wallX = side * (HALL_WIDTH / 2 - 0.035);
        const base = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.20, HALL_LENGTH), darkPaint);
        base.position.set(wallX, 0.10, -HALL_LENGTH / 2); scene.add(base);
        const bumper = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, HALL_LENGTH), paint);
        bumper.position.set(wallX - side * 0.02, 0.86, -HALL_LENGTH / 2); scene.add(bumper);
        for (let z = -2; z > -HALL_LENGTH + 2; z -= 3.8) {
            const rail = tube(2.95, 0.024, steel); rail.rotation.x = Math.PI / 2; rail.position.set(wallX - side * 0.14, 1.12, z - 1.4); scene.add(rail);
            [-0.95, 0.95].forEach(offset => { const mount = tube(0.15, 0.017, steel); mount.rotation.z = Math.PI / 2; mount.position.set(wallX - side * 0.07, 1.12, z + offset - 1.4); scene.add(mount); });
        }
    });

    // Grid físico de techo, canaletas y luminarias: objetos visibles que justifican la iluminación en vez de una luz flotante.
    for (let z = -2.5; z > -HALL_LENGTH + 2.5; z -= 4.0) {
        const cross = new THREE.Mesh(new THREE.BoxGeometry(HALL_WIDTH, 0.075, 0.06), darkPaint); cross.position.set(0, WALL_HEIGHT - 0.025, z); scene.add(cross);
        const housing = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.10, 0.42), steel); housing.position.set(0, WALL_HEIGHT - 0.10, z); scene.add(housing);
        const panel = new THREE.Mesh(new THREE.BoxGeometry(1.38, 0.025, 0.24), diffuser); panel.position.set(0, WALL_HEIGHT - 0.16, z); scene.add(panel);
    }
    const cableTray = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.10, HALL_LENGTH - 1.2), steel); cableTray.position.set(2.36, WALL_HEIGHT - 0.19, -HALL_LENGTH / 2); scene.add(cableTray);
    for (let z = -3; z > -HALL_LENGTH + 3; z -= 5.0) {
        const conduit = tube(1.32, 0.036, steel); conduit.rotation.x = Math.PI / 2; conduit.position.set(-2.47, WALL_HEIGHT - 0.42, z); scene.add(conduit);
        const junction = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.105, 0.06, 8), steel); junction.rotation.x = Math.PI / 2; junction.position.set(-2.47, WALL_HEIGHT - 0.42, z + 0.62); scene.add(junction);
    }

    // Objetos de infraestructura legibles — gabinetes, rejillas y señalética empotrada — para romper paredes planas.
    for (let z = -9; z > -HALL_LENGTH + 7; z -= 12) {
        const fireBox = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.62, 0.42), new THREE.MeshStandardMaterial({ color: 0x5d201e, roughness: 0.68, metalness: 0.36 }));
        fireBox.position.set(2.965, 1.42, z); scene.add(fireBox);
        const glass = new THREE.Mesh(new THREE.BoxGeometry(0.078, 0.44, 0.25), new THREE.MeshStandardMaterial({ color: 0x752422, transparent: true, opacity: 0.48, roughness: 0.14, metalness: 0.2 }));
        glass.position.set(3.012, 1.42, z); scene.add(glass);
        const vent = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.34, 0.78), rubber); vent.position.set(-3.005, 2.55, z - 2.0); scene.add(vent);
        for (let y = 2.43; y <= 2.67; y += 0.06) { const fin = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.012, 0.65), steel); fin.position.set(-3.05, y, z - 2.0); scene.add(fin); }
    }

    // Manchas localizadas con bordes irregulares. Son pocas y se concentran donde entraría agua: umbral y canaletas.
    const puddles = [[-0.7, 7.0, 1.45, 0.58], [0.85, -13.5, 1.15, 0.42], [-0.25, -37.0, 1.42, 0.55], [0.7, -54.0, 0.95, 0.38]];
    puddles.forEach(([x, z, sx, sz], idx) => {
        const puddle = new THREE.Mesh(new THREE.CircleGeometry(1, 18), wet);
        puddle.rotation.x = -Math.PI / 2; puddle.scale.set(sx, sz, 1); puddle.position.set(x, 0.011 + idx * 0.001, z); scene.add(puddle);
    });

    // La recepción obtiene una trama de zócalos y pasamanos de mayor escala sin saturar la escena de luces dinámicas.
    [-9.92, 9.92].forEach(x => {
        const base = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.19, 21.5), darkPaint); base.position.set(x, 0.095, 13.0); scene.add(base);
        const rail = tube(18.4, 0.026, steel); rail.rotation.x = Math.PI / 2; rail.position.set(x * 0.985, 1.08, 13.0); scene.add(rail);
        for (let z = 4.6; z < 22.0; z += 3.5) { const mount = tube(0.16, 0.018, steel); mount.rotation.z = Math.PI / 2; mount.position.set(x * 0.992, 1.08, z); scene.add(mount); }
    });
}

function createDetailedDoor(x, z, roomIdx) {
    const group = new THREE.Group();
    const room = ROOM_DATA[roomIdx];
    const doorMat = materials.doorTextures[roomIdx];

    const frameMat = materials.rustyMetal;

    const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.2, WALL_HEIGHT, 0.2), frameMat);
    frameL.position.set(0, WALL_HEIGHT / 2, 0.9);
    frameL.castShadow = true; frameL.receiveShadow = true;

    const frameR = new THREE.Mesh(new THREE.BoxGeometry(0.2, WALL_HEIGHT, 0.2), frameMat);
    frameR.position.set(0, WALL_HEIGHT / 2, -0.9);
    frameR.castShadow = true; frameR.receiveShadow = true;

    const frameT = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 2), frameMat);
    frameT.position.set(0, WALL_HEIGHT - 0.1, 0);

    group.add(frameL, frameR, frameT);

    // Sellado oscuro detrás de la puerta para que no se vea "transparencia" hacia el cuarto
    const sealGeo = new THREE.BoxGeometry(0.05, WALL_HEIGHT - 0.28, 1.72);
    const sealMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0, metalness: 0.0 });
    const seal = new THREE.Mesh(sealGeo, sealMat);
    seal.position.set(0.025, WALL_HEIGHT / 2 - 0.02, 0.0);
    seal.castShadow = true;
    seal.receiveShadow = true;
    group.add(seal);

    const doorGeo = new THREE.BoxGeometry(0.1, WALL_HEIGHT - 0.2, 1.8);
    const door = new THREE.Mesh(doorGeo, doorMat);
    door.geometry.translate(0, 0, -0.9);
    door.position.set(0.1, WALL_HEIGHT / 2 - 0.1, 0.9);
    door.castShadow = true;
    door.receiveShadow = true;
    group.add(door);

    const startsAjar = false;
    const closedAngle = 0;
    const openAngle = Math.PI / 1.9;
    door.rotation.y = closedAngle;
    seal.visible = true;

    group.position.set(x, 0, z);
    scene.add(group);

    const roomBounds = createRoomInterior(x, z, roomIdx);

    doors.push({
        doorMesh: door,
        sealMesh: seal,
        group,
        worldPos: new THREE.Vector3(x, 1.4, z),
        isOpen: startsAjar,
        targetAngle: startsAjar ? openAngle : closedAngle,
        openAngle,
        closedAngle,
        currentAngle: door.rotation.y,
        roomLabel: `${room.num} · ${room.label}`,
        doorZMin: z - 0.9,
        doorZMax: z + 0.9,
        roomBounds
    });
}

function createRoomInterior(doorX, doorZ, roomIdx) {
    const room = ROOM_DATA[roomIdx];
    const group = new THREE.Group();
    const roomHalfWidth = ROOM_WIDTH / 2;
    const roomHalfDepth = ROOM_DEPTH / 2;
    const centerX = doorX - roomHalfWidth - 0.18;
    const doorOpeningWidth = 1.7;
    const wallThickness = 0.16;
    const topGapHeight = WALL_HEIGHT - 1.9;

    // Piso y techo más amplios para sentirse como cuarto real de hospital
    const roomFloorGeo = new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH);
    const roomFloor = new THREE.Mesh(roomFloorGeo, materials.floor);
    roomFloor.rotation.x = -Math.PI / 2;
    roomFloor.position.set(centerX, 0, doorZ);
    roomFloor.receiveShadow = true;
    group.add(roomFloor);

    const roomCeilGeo = new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH);
    const roomCeil = new THREE.Mesh(roomCeilGeo, materials.ceiling);
    roomCeil.rotation.x = Math.PI / 2;
    roomCeil.position.set(centerX, WALL_HEIGHT, doorZ);
    roomCeil.receiveShadow = true;
    group.add(roomCeil);

    // Pared trasera
    const backWallGeo = new THREE.BoxGeometry(wallThickness, WALL_HEIGHT, ROOM_DEPTH);
    const backWall = new THREE.Mesh(backWallGeo, materials.leftWall);
    backWall.position.set(centerX - roomHalfWidth + wallThickness / 2, WALL_HEIGHT / 2, doorZ);
    backWall.castShadow = true;
    backWall.receiveShadow = true;
    group.add(backWall);

    // Paredes laterales
    const sideWallGeo = new THREE.BoxGeometry(ROOM_WIDTH, WALL_HEIGHT, wallThickness);
    const sideWallA = new THREE.Mesh(sideWallGeo, materials.rightWall);
    sideWallA.position.set(centerX, WALL_HEIGHT / 2, doorZ + roomHalfDepth - wallThickness / 2);
    sideWallA.castShadow = true;
    sideWallA.receiveShadow = true;
    group.add(sideWallA);

    const sideWallB = new THREE.Mesh(sideWallGeo, materials.rightWall);
    sideWallB.position.set(centerX, WALL_HEIGHT / 2, doorZ - roomHalfDepth + wallThickness / 2);
    sideWallB.castShadow = true;
    sideWallB.receiveShadow = true;
    group.add(sideWallB);

    // Frente cerrado con vano de puerta bien sellado
    const frontLeftLen = (ROOM_DEPTH - doorOpeningWidth) / 2;
    const frontRightLen = frontLeftLen;
    const frontSideGeo = new THREE.BoxGeometry(wallThickness, WALL_HEIGHT, frontLeftLen);
    const frontLeft = new THREE.Mesh(frontSideGeo, materials.leftWall);
    frontLeft.position.set(doorX - wallThickness / 2, WALL_HEIGHT / 2, doorZ - (doorOpeningWidth / 2 + frontLeftLen / 2));
    frontLeft.castShadow = true;
    frontLeft.receiveShadow = true;
    group.add(frontLeft);

    const frontRight = new THREE.Mesh(frontSideGeo, materials.leftWall);
    frontRight.position.set(doorX - wallThickness / 2, WALL_HEIGHT / 2, doorZ + (doorOpeningWidth / 2 + frontRightLen / 2));
    frontRight.castShadow = true;
    frontRight.receiveShadow = true;
    group.add(frontRight);

    const frontTopGeo = new THREE.BoxGeometry(wallThickness, topGapHeight, doorOpeningWidth);
    const frontTop = new THREE.Mesh(frontTopGeo, materials.leftWall);
    frontTop.position.set(doorX - wallThickness / 2, WALL_HEIGHT - topGapHeight / 2, doorZ);
    frontTop.castShadow = true;
    frontTop.receiveShadow = true;
    group.add(frontTop);

    // Umbral oscuro para que la puerta no deje ver "aire" a través
    const thresholdGeo = new THREE.BoxGeometry(0.12, 0.05, doorOpeningWidth - 0.1);
    const threshold = new THREE.Mesh(thresholdGeo, materials.darkMetal);
    threshold.position.set(doorX - 0.02, 0.025, doorZ);
    threshold.castShadow = true;
    threshold.receiveShadow = true;
    group.add(threshold);

    // Luz interior más amplia y más natural
    const roomLight = new THREE.PointLight(0x8899aa, 4.4, 8);
    roomLight.position.set(centerX, WALL_HEIGHT - 0.45, doorZ);
    roomLight.castShadow = false;
    group.add(roomLight);
    lights.push({ light: roomLight, mat: null, baseInt: 4.4, isBroken: Math.random() > 0.5 });

    // Mobiliario más acorde al tamaño real del cuarto
    if (room.label === 'MORGUE') {
        const slabGeo = new THREE.BoxGeometry(0.95, 0.52, 2.3);
        const slab = new THREE.Mesh(slabGeo, materials.darkMetal);
        slab.position.set(centerX - 0.85, 0.26, doorZ);
        slab.castShadow = true; slab.receiveShadow = true;
        group.add(slab);
    } else if (room.label === 'FARMACIA' || room.label === 'ARCHIVO') {
        for (let i = 0; i < 3; i++) {
            const shelfGeo = new THREE.BoxGeometry(0.34, 1.9, 0.9);
            const shelf = new THREE.Mesh(shelfGeo, materials.rustyMetal);
            shelf.position.set(centerX - roomHalfWidth + 0.55, 0.95, doorZ - 1.6 + i * 1.6);
            shelf.castShadow = true; shelf.receiveShadow = true;
            group.add(shelf);
        }
    } else if (room.label === 'AISLAMIENTO' || room.label === 'PSIQUIATRÍA') {
        const padGeo = new THREE.BoxGeometry(2.0, 0.16, 0.8);
        const padMat = new THREE.MeshStandardMaterial({ color: 0x2a2620, roughness: 1.0 });
        const pad = new THREE.Mesh(padGeo, padMat);
        pad.position.set(centerX - 0.65, 0.08, doorZ + 1.0);
        pad.rotation.y = Math.random() * Math.PI * 0.5;
        pad.castShadow = true; pad.receiveShadow = true;
        group.add(pad);
    } else {
        const chair = createHospitalChair(centerX - 1.1, 0.0, doorZ + 1.1);
        group.add(chair);
    }

    // Papeles y suciedad, pero sin saturar el suelo
    const paperMat = new THREE.MeshStandardMaterial({ color: 0xdcdccb, roughness: 1.0, side: THREE.DoubleSide });
    for (let i = 0; i < 4; i++) {
        const paperGeo = new THREE.PlaneGeometry(0.2, 0.28);
        const paper = new THREE.Mesh(paperGeo, paperMat);
        paper.position.set(centerX + (Math.random() - 0.5) * (ROOM_WIDTH - 0.8), 0.012, doorZ + (Math.random() - 0.5) * (ROOM_DEPTH - 0.8));
        paper.rotation.x = -Math.PI / 2;
        paper.rotation.z = Math.random() * Math.PI;
        paper.receiveShadow = true;
        group.add(paper);
    }

    scene.add(group);

    return {
        xMin: centerX - roomHalfWidth + 0.5,
        xMax: doorX - 0.35,
        zMin: doorZ - roomHalfDepth + 0.5,
        zMax: doorZ + roomHalfDepth - 0.5
    };
}

function createWallSconce(wallX, z) {
    const group = new THREE.Group();
    const isLeft = wallX < 0;
    const dir = isLeft ? 1 : -1; // direction extending from wall into room

    const metalMat = new THREE.MeshStandardMaterial({ color: 0x252015, roughness: 0.72, metalness: 0.68 });
    const glowMat = new THREE.MeshStandardMaterial({
        color: 0xfffbe0,
        roughness: 0.28,
        emissive: 0xfff080,
        emissiveIntensity: 1.6
    });

    // Mounting plate (flush against wall)
    const plate = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.3, 0.06), metalMat);
    plate.castShadow = true;
    group.add(plate);

    // Horizontal bracket arm
    const bracketLen = 0.22;
    const bracket = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, bracketLen, 8), metalMat);
    bracket.rotation.z = Math.PI / 2;
    bracket.position.set(dir * bracketLen / 2, 0.04, 0);
    bracket.castShadow = true;
    group.add(bracket);

    // Lamp shade (inverted cone, open downward)
    const shadeGeo = new THREE.ConeGeometry(0.13, 0.19, 10, 1, true);
    const shade = new THREE.Mesh(shadeGeo, metalMat);
    shade.position.set(dir * bracketLen, -0.11, 0);
    shade.rotation.z = Math.PI;
    shade.castShadow = true;
    group.add(shade);

    // Top cap for shade
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.04, 8), metalMat);
    cap.position.set(dir * bracketLen, -0.005, 0);
    group.add(cap);

    // Glowing bulb inside shade
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), glowMat);
    bulb.position.set(dir * bracketLen, -0.07, 0);
    group.add(bulb);

    // Rust/soot stain on wall surface behind bracket
    const stainMat = new THREE.MeshStandardMaterial({ color: 0x0e0c09, roughness: 1.0, transparent: true, opacity: 0.45, depthWrite: false });
    const stain = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.38), stainMat);
    stain.position.set(isLeft ? -0.03 : 0.03, 0.02, 0);
    stain.rotation.y = isLeft ? Math.PI / 2 : -Math.PI / 2;
    group.add(stain);

    const height = 2.15;
    group.position.set(wallX, height, z);
    scene.add(group);

    // Warm amber point light
    const wallLight = new THREE.PointLight(0xffbb44, 6.5, 11);
    wallLight.position.set(wallX + dir * bracketLen * 0.9, height - 0.2, z);
    wallLight.castShadow = false;
    scene.add(wallLight);

    lights.push({ light: wallLight, mat: glowMat, baseInt: 6.5, isBroken: Math.random() > 0.5 });
}

function createHospitalChair(x, y, z) {
    const group = new THREE.Group();

    const seatMat = materials.darkMetal;
    const frameMat = materials.rustyMetal;

    // Asiento ligeramente redondeado
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.05, 0.5, 2, 1, 2), seatMat);
    seat.position.y = 0.42;
    seat.rotation.z = 0.02;
    seat.castShadow = true;
    seat.receiveShadow = true;
    group.add(seat);

    const cushion = new THREE.Mesh(
        new THREE.CylinderGeometry(0.24, 0.24, 0.5, 10, 1, false),
        new THREE.MeshStandardMaterial({ color: 0x3b372c, roughness: 1.0 })
    );
    cushion.rotation.z = Math.PI / 2;
    cushion.position.set(0, 0.47, 0);
    cushion.castShadow = true;
    group.add(cushion);

    // Respaldo tubular, más parecido a silla hospitalaria real
    const backFrame = new THREE.Group();
    const backPostGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.7, 8);
    const backBar = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.52, 8), frameMat);
    backBar.rotation.z = Math.PI / 2;
    backBar.position.set(0, 0.73, -0.19);
    backBar.castShadow = true;
    backFrame.add(backBar);

    const leftPost = new THREE.Mesh(backPostGeo, frameMat);
    leftPost.position.set(-0.22, 0.75, -0.18);
    leftPost.rotation.z = -0.06;
    leftPost.castShadow = true;
    backFrame.add(leftPost);

    const rightPost = new THREE.Mesh(backPostGeo, frameMat);
    rightPost.position.set(0.22, 0.75, -0.18);
    rightPost.rotation.z = 0.06;
    rightPost.castShadow = true;
    backFrame.add(rightPost);

    group.add(backFrame);

    // Brazos
    const armGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.5, 8);

function createHospitalBed(x, z) {
    const group = new THREE.Group();
    const bedLength = 2.0, bedWidth = 0.9, bedHeight = 0.75;

    function createEndPanel(zOffset) {
        const panelGroup = new THREE.Group();
        const postGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.35);
        for (let i = -1; i <= 1; i++) {
            const post = new THREE.Mesh(postGeo, materials.rustyMetal);
            post.position.set(i * bedWidth / 2, bedHeight + 0.15, 0);
            post.castShadow = true;
            panelGroup.add(post);
        }
        const railGeo = new THREE.CylinderGeometry(0.02, 0.02, bedWidth);
        const rail = new THREE.Mesh(railGeo, materials.rustyMetal);
        rail.rotation.z = Math.PI / 2;
        rail.position.set(0, bedHeight + 0.3, 0);
        rail.castShadow = true;
        panelGroup.add(rail);
        panelGroup.position.z = zOffset;
        return panelGroup;
    }

    function createSideRail(xSide, lowered) {
        const railGroup = new THREE.Group();
        const barGeo = new THREE.CylinderGeometry(0.018, 0.018, bedLength * 0.85);
        for (let level = 0; level < 2; level++) {
            const bar = new THREE.Mesh(barGeo, materials.darkMetal);
            bar.rotation.x = Math.PI / 2;
            bar.position.set(0, 0.15 + level * 0.13, 0);
            railGroup.add(bar);
        }
        railGroup.position.set(xSide, bedHeight + (lowered ? 0.02 : 0.22), 0);
        if (lowered) railGroup.rotation.z = xSide > 0 ? -0.55 : 0.55;
        railGroup.traverse(c => { if (c.isMesh) c.castShadow = true; });
        return railGroup;
    }

    group.add(createEndPanel(bedLength / 2));
    group.add(createEndPanel(-bedLength / 2));
    group.add(createSideRail(bedWidth / 2, false));
    group.add(createSideRail(-bedWidth / 2, true));

    const frameGeo = new THREE.BoxGeometry(bedWidth, 0.06, bedLength);
    const frame = new THREE.Mesh(frameGeo, materials.darkMetal);
    frame.position.y = bedHeight;
    frame.castShadow = true;
    frame.receiveShadow = true;
    group.add(frame);

    const meshGeo = new THREE.PlaneGeometry(bedWidth - 0.05, bedLength - 0.05, 6, 10);
    const meshMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.7, wireframe: true });
    const meshPlane = new THREE.Mesh(meshGeo, meshMat);
    meshPlane.rotation.x = -Math.PI / 2;
    meshPlane.position.y = bedHeight - 0.01;
    group.add(meshPlane);

    const mattGeo = new THREE.BoxGeometry(bedWidth - 0.08, 0.18, bedLength - 0.1, 8, 2, 12);
    const posAttr = mattGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
        const yVal = posAttr.getY(i);
        if (yVal > 0) posAttr.setY(i, yVal + (Math.random() - 0.5) * 0.035);
    }
    posAttr.needsUpdate = true;
    mattGeo.computeVertexNormals();
    const mattress = new THREE.Mesh(mattGeo, materials.mattress);
    mattress.position.y = bedHeight + 0.1;
    mattress.rotation.z = (Math.random() - 0.5) * 0.04;
    mattress.castShadow = true;
    mattress.receiveShadow = true;
    group.add(mattress);

    const sheetGeo = new THREE.PlaneGeometry(0.9, 1.6, 6, 10);
    const sheetPos = sheetGeo.attributes.position;
    for (let i = 0; i < sheetPos.count; i++) {
        sheetPos.setZ(i, Math.sin(sheetPos.getY(i) * 3 + sheetPos.getX(i) * 2) * 0.05);
    }
    sheetPos.needsUpdate = true;
    sheetGeo.computeVertexNormals();
    const sheet = new THREE.Mesh(sheetGeo, materials.sheet);
    sheet.position.set(-bedWidth / 2 - 0.05, bedHeight - 0.55, 0.1);
    sheet.rotation.y = Math.PI / 2;
    sheet.rotation.z = 0.15;
    sheet.castShadow = true;
    group.add(sheet);

    const pillowGeo = new THREE.BoxGeometry(0.5, 0.1, 0.35, 4, 2, 4);
    const pillowPos = pillowGeo.attributes.position;
    for (let i = 0; i < pillowPos.count; i++) {
        if (pillowPos.getY(i) > 0) pillowPos.setY(i, pillowPos.getY(i) + (Math.random() - 0.5) * 0.04);
    }
    pillowPos.needsUpdate = true;
    pillowGeo.computeVertexNormals();
    const pillow = new THREE.Mesh(pillowGeo, materials.sheet);
    pillow.position.set(0.05, bedHeight + 0.22, bedLength / 2 - 0.35);
    pillow.rotation.y = 0.3;
    pillow.castShadow = true;
    group.add(pillow);

    const legGeo = new THREE.CylinderGeometry(0.03, 0.03, bedHeight - 0.1);
    const wheelGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.04);
    for (let i = -1; i <= 1; i += 2) {
        for (let j = -1; j <= 1; j += 2) {
            const legX = i * (bedWidth / 2 - 0.05), legZ = j * (bedLength / 2 - 0.1);
            const leg = new THREE.Mesh(legGeo, materials.rustyMetal);
            leg.position.set(legX, (bedHeight - 0.1) / 2, legZ);
            leg.castShadow = true;
            group.add(leg);

            const wheelPivot = new THREE.Group();
            wheelPivot.position.set(legX, 0.06, legZ);
            wheelPivot.rotation.y = Math.random() * Math.PI;
            const wheel = new THREE.Mesh(wheelGeo, materials.darkMetal);
            wheel.rotation.z = Math.PI / 2;
            wheel.castShadow = true;
            wheelPivot.add(wheel);
            group.add(wheelPivot);
        }
    }

    const trayTopGeo = new THREE.BoxGeometry(0.35, 0.02, 0.22);
    const trayTop = new THREE.Mesh(trayTopGeo, materials.darkMetal);
    const trayLegGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.7);
    const trayLeg = new THREE.Mesh(trayLegGeo, materials.rustyMetal);
    const trayGroup = new THREE.Group();
    trayGroup.add(trayTop, trayLeg);
    trayTop.position.y = 0.35;
    trayLeg.position.y = 0.35;
    trayGroup.position.set(0.35, 0, 0.6);
    trayGroup.rotation.z = 0.4;
    trayGroup.rotation.x = 0.1;
    group.add(trayGroup);

    group.position.set(x, 0, z);
    scene.add(group);
}

function createWheelchair(x, z) {
    const group = new THREE.Group();
    const tubeMat   = new THREE.MeshStandardMaterial({ color: 0x909090, roughness: 0.36, metalness: 0.90 });
    const frameMat  = new THREE.MeshStandardMaterial({ color: 0x686868, roughness: 0.45, metalness: 0.82 });
    const fabricMat = new THREE.MeshStandardMaterial({ color: 0x131313, roughness: 0.96 });
    const rubberMat = new THREE.MeshStandardMaterial({ color: 0x090909, roughness: 0.96, metalness: 0.03 });
    const rimMat    = new THREE.MeshStandardMaterial({ color: 0xbababa, roughness: 0.26, metalness: 0.93 });
    const TR = 0.013; // tube radius

    // ── Seat & backrest sling fabric ───────────────────────────────────────
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.030, 0.42), fabricMat);
    seat.position.set(0, 0.48, 0.01);
    seat.castShadow = true; seat.receiveShadow = true; group.add(seat);

    const back = new THREE.Mesh(new THREE.BoxGeometry(0.40, 0.50, 0.030), fabricMat);
    back.position.set(0, 0.745, -0.215);
    back.rotation.x = 0.07;
    back.castShadow = true; group.add(back);

    // ── Side frame tubes (both sides mirrored) ─────────────────────────────
    [-0.232, 0.232].forEach(sx => {
        // Rear upright — floor to push handle top
        const rearUp = new THREE.Mesh(new THREE.CylinderGeometry(TR, TR, 1.06, 8), frameMat);
        rearUp.position.set(sx, 0.53, -0.21);
        rearUp.castShadow = true; group.add(rearUp);

        // Front upright — floor to armrest
        const frontUp = new THREE.Mesh(new THREE.CylinderGeometry(TR, TR, 0.50, 8), frameMat);
        frontUp.position.set(sx, 0.25, 0.21);
        frontUp.castShadow = true; group.add(frontUp);

        // Lower longitudinal rail (near floor, front-to-rear)
        const lowRail = new THREE.Mesh(new THREE.CylinderGeometry(TR, TR, 0.44, 8), frameMat);
        lowRail.rotation.x = Math.PI / 2;
        lowRail.position.set(sx, 0.09, 0.0);
        group.add(lowRail);

        // Seat-level rail
        const seatRail = new THREE.Mesh(new THREE.CylinderGeometry(TR, TR, 0.44, 8), frameMat);
        seatRail.rotation.x = Math.PI / 2;
        seatRail.position.set(sx, 0.465, 0.0);
        group.add(seatRail);

        // Armrest tube
        const armTube = new THREE.Mesh(new THREE.CylinderGeometry(TR, TR, 0.40, 8), frameMat);
        armTube.rotation.x = Math.PI / 2;
        armTube.position.set(sx, 0.665, -0.01);
        group.add(armTube);

        // Armrest foam pad
        const armPad = new THREE.Mesh(new THREE.BoxGeometry(0.036, 0.022, 0.36), fabricMat);
        armPad.position.set(sx, 0.677, -0.01);
        group.add(armPad);

        // Diagonal brace (rear-low → front-mid)
        const diagLen = 0.46;
        const diag = new THREE.Mesh(new THREE.CylinderGeometry(TR * 0.88, TR * 0.88, diagLen, 8), frameMat);
        diag.rotation.x = -0.57;
        diag.position.set(sx, 0.285, 0.02);
        group.add(diag);
    });

    // Lateral cross bar near floor
    const crossLow = new THREE.Mesh(new THREE.CylinderGeometry(TR, TR, 0.464, 8), frameMat);
    crossLow.rotation.z = Math.PI / 2;
    crossLow.position.set(0, 0.09, 0.0);
    group.add(crossLow);

    // X-fold pivot bar (visible center rod)
    const pivot = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.48, 8), rimMat);
    pivot.rotation.z = Math.PI / 2;
    pivot.position.set(0, 0.29, 0.0);
    group.add(pivot);

    // ── Push handles ───────────────────────────────────────────────────────
    const handleBar = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.50, 8), frameMat);
    handleBar.rotation.z = Math.PI / 2;
    handleBar.position.set(0, 1.065, -0.21);
    handleBar.castShadow = true; group.add(handleBar);

    for (const hx of [-0.235, 0.235]) {
        const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.10, 8), rubberMat);
        grip.rotation.z = Math.PI / 2;
        grip.position.set(hx, 1.065, -0.21);
        group.add(grip);
    }

    // ── Large rear wheels with spokes ─────────────────────────────────────
    const RR = 0.28;
    for (const wx of [-0.293, 0.293]) {
        const wg = new THREE.Group();

        // Rubber tyre
        const tire = new THREE.Mesh(new THREE.TorusGeometry(RR, 0.028, 8, 20), rubberMat);
        tire.castShadow = true; wg.add(tire);

        // Metal rim disc
        const rimDisc = new THREE.Mesh(new THREE.CylinderGeometry(RR - 0.03, RR - 0.03, 0.012, 18), rimMat);
        wg.add(rimDisc);

        // Hub
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.047, 0.047, 0.030, 10), rimMat);
        wg.add(hub);

        // 8 spokes
        const spL = RR - 0.075;
        for (let s = 0; s < 8; s++) {
            const a = (s / 8) * Math.PI * 2;
            const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, spL, 4), rimMat);
            sp.rotation.z = a + Math.PI / 2;
            sp.position.set(Math.cos(a) * (spL / 2 + 0.047), Math.sin(a) * (spL / 2 + 0.047), 0);
            wg.add(sp);
        }

        // Push rim (self-propel ring)
        const pushRim = new THREE.Mesh(new THREE.TorusGeometry(RR - 0.055, 0.009, 5, 16), rimMat);
        wg.add(pushRim);

        wg.rotation.x = Math.PI / 2;
        wg.position.set(wx, RR + 0.01, -0.08);
        group.add(wg);
    }

    // ── Small front caster wheels ──────────────────────────────────────────
    const CR = 0.065;
    for (const cx of [-0.2, 0.2]) {
        const cg = new THREE.Group();

        // Fork
        const fork = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.10, 0.025), frameMat);
        fork.position.y = CR + 0.04;
        cg.add(fork);

        // Caster tyre — rotation.y puts the torus in the YZ plane so it rolls along Z
        const cTire = new THREE.Mesh(new THREE.TorusGeometry(CR, 0.020, 6, 12), rubberMat);
        cTire.rotation.y = Math.PI / 2;
        cTire.castShadow = true; cg.add(cTire);

        // Caster hub — rotation.z aligns the cylinder axle along X (left-right)
        const cHub = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.030, 8), rimMat);
        cHub.rotation.z = Math.PI / 2; cg.add(cHub);

        cg.position.set(cx, CR + 0.005, 0.25);
        cg.rotation.y = 0;
        group.add(cg);
    }

    // ── Footrests ──────────────────────────────────────────────────────────
    const footPlateMat = new THREE.MeshStandardMaterial({ color: 0x303030, roughness: 0.65, metalness: 0.72 });
    for (const fsx of [-0.2, 0.2]) {
        const footArm = new THREE.Mesh(new THREE.CylinderGeometry(TR, TR, 0.28, 8), frameMat);
        footArm.rotation.x = Math.PI / 2;
        footArm.position.set(fsx, 0.20, 0.32);
        group.add(footArm);

        const footPlate = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.018, 0.10), footPlateMat);
        footPlate.position.set(fsx, 0.13, 0.39);
        footPlate.castShadow = true; group.add(footPlate);
    }

    group.rotation.y = Math.random() * Math.PI * 2;
    group.rotation.z = (Math.random() - 0.5) * 0.05;
    group.position.set(x, 0, z);
    scene.add(group);
    registerThrowable(group);
}
