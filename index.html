// ═══════════════════════════════════════════════════════════════════════════
// TELEKINESIS SYSTEM
// ═══════════════════════════════════════════════════════════════════════════

let tkMode = false;               // telekinesis active
let tkTarget = null;              // current grabbed object (THREE.Object3D)
let tkTargetGroup = null;         // top-level group
let tkLiftProgress = 0;           // 0→1 as object rises
let tkLifted = false;             // object is fully up and held
let tkThrowVelocity = new THREE.Vector3();
let tkObjects = [];               // throwable scene objects
let tkInFlight = [];              // { obj, vel, life } thrown objects
const TK_LIFT_HEIGHT = 1.5;
const TK_HOLD_DIST   = 3.0;
const TK_THROW_SPEED = 18;
const raycaster = new THREE.Raycaster();

function registerThrowable(obj) {
    tkObjects.push(obj);
}

function toggleTelekinesis() {
    if (tkLifted && tkTarget) {
        // Throw it
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        tkInFlight.push({
            obj: tkTarget,
            group: tkTargetGroup,
            vel: dir.multiplyScalar(TK_THROW_SPEED),
            rotVel: new THREE.Euler(
                (Math.random() - 0.5) * 8,
                (Math.random() - 0.5) * 8,
                (Math.random() - 0.5) * 8
            ),
            life: 2.5
        });
        tkTarget = null;
        tkTargetGroup = null;
        tkLifted = false;
        tkLiftProgress = 0;
        setTKMode(false);
        triggerTKFeedback(false);
        return;
    }

    if (tkMode) {
        setTKMode(false);
        return;
    }

    setTKMode(true);
    // Raycast for target
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = raycaster.intersectObjects(tkObjects, true);
    if (hits.length > 0 && hits[0].distance < 8) {
        // Find top-level group
        let obj = hits[0].object;
        let top = obj;
        while (top.parent && top.parent !== scene) top = top.parent;
        tkTarget = top;
        tkTargetGroup = top;
        tkLiftProgress = 0;
        tkLifted = false;
    }
    triggerTKFeedback(true);
}

function setTKMode(on) {
    tkMode = on;
    const btn = document.getElementById('tk-btn');
    const reticle = document.getElementById('tk-reticle');
    const hint = document.getElementById('tk-hint');
    if (btn) btn.classList.toggle('active', on);
    if (reticle) reticle.style.display = on ? 'block' : 'none';
    if (hint) {
        hint.style.display = on && tkTarget ? 'block' : 'none';
        hint.textContent = tkLifted ? '[ F / TAP ] THROW' : '[ F / TAP ] GRAB';
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// ENHANCED TELEKINESIS EFFECTS
// ═══════════════════════════════════════════════════════════════════════════
let tkShockwaves = [];
let tkGlowMesh = null;
let tkLiftDust = [];

function triggerTKFeedback(on) {
    const vf = document.getElementById('vignette-flash');
    if (!vf) return;

    // Multi-layered flash effect
    vf.style.background = on
        ? 'radial-gradient(circle, rgba(120,40,255,0.35) 0%, rgba(60,20,120,0.2) 40%, transparent 70%)'
        : 'radial-gradient(circle, rgba(255,60,60,0.25) 0%, rgba(120,0,0,0.15) 40%, transparent 70%)';
    vf.style.opacity = '1';

    // Chromatic aberration burst
    const ca = document.querySelector('.chromatic-aberration');
    if (ca) {
        ca.style.opacity = '0.8';
        setTimeout(() => { ca.style.opacity = caIntensity; }, 150);
    }

    // Screen shake burst
    cameraShake += on ? 0.08 : 0.05;

    setTimeout(() => {
        vf.style.opacity = '0';
        vf.style.background = 'transparent';
    }, 300);

    // Create shockwave effect
    createTKShockwave(on);
}

function createTKShockwave(isActivate) {
    // Create expanding ring mesh
    const ringGeo = new THREE.RingGeometry(0.1, 0.15, 32);
    const ringMat = new THREE.MeshBasicMaterial({
        color: isActivate ? 0x8844ff : 0xff4444,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(camera.position);
    ring.position.y = 1.6;
    ring.lookAt(camera.position.x, camera.position.y + 10, camera.position.z);
    scene.add(ring);

    tkShockwaves.push({
        mesh: ring,
        life: 0,
        maxLife: 0.8,
        startRadius: 0.1,
        endRadius: isActivate ? 4 : 2.5,
        isActivate
    });

    // Second ring (delayed)
    if (isActivate) {
        setTimeout(() => {
            const ring2Geo = new THREE.RingGeometry(0.1, 0.12, 32);
            const ring2Mat = new THREE.MeshBasicMaterial({
                color: 0x00ccff,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
            ring2.position.copy(camera.position);
            ring2.position.y = 1.6;
            ring2.lookAt(camera.position.x, camera.position.y + 10, camera.position.z);
            scene.add(ring2);

            tkShockwaves.push({
                mesh: ring2,
                life: 0,
                maxLife: 0.6,
                startRadius: 0.1,
                endRadius: 3,
                isActivate: true
            });
        }, 100);
    }
}

function updateTKShockwaves(dt) {
    for (let i = tkShockwaves.length - 1; i >= 0; i--) {
        const sw = tkShockwaves[i];
        sw.life += dt;
        const t = sw.life / sw.maxLife;

        if (t >= 1) {
            scene.remove(sw.mesh);
            sw.mesh.geometry.dispose();
            sw.mesh.material.dispose();
            tkShockwaves.splice(i, 1);
            continue;
        }

        // Expand ring
        const radius = sw.startRadius + (sw.endRadius - sw.startRadius) * t;
        sw.mesh.geometry.dispose();
        sw.mesh.geometry = new THREE.RingGeometry(radius * 0.9, radius, 32);
        sw.mesh.material.opacity = 0.8 * (1 - t);

        // Slight float up
        sw.mesh.position.y += dt * 0.5;
    }
}

function createTKGlow() {
    if (tkGlowMesh) return;
    const glowGeo = new THREE.SphereGeometry(0.6, 16, 16);
    const glowMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uIntensity: { value: 0 }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vPos;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vPos = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform float uIntensity;
            varying vec3 vNormal;
            varying vec3 vPos;
            void main() {
                float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.0);
                float pulse = 0.8 + 0.2 * sin(uTime * 3.0);
                vec3 col = mix(vec3(0.4, 0.1, 1.0), vec3(0.0, 0.7, 1.0), fresnel);
                float alpha = fresnel * uIntensity * pulse * 0.6;
                gl_FragColor = vec4(col, alpha);
            }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide
    });
    tkGlowMesh = new THREE.Mesh(glowGeo, glowMat);
    tkGlowMesh.visible = false;
    scene.add(tkGlowMesh);
}

function updateTKEffects(dt) {
    updateTKShockwaves(dt);

    if (!tkGlowMesh) createTKGlow();

    if (tkMode && tkTarget) {
        tkGlowMesh.visible = true;
        tkGlowMesh.position.copy(tkTarget.position);
        const targetIntensity = tkLifted ? 1.0 : tkLiftProgress;
        tkGlowMesh.material.uniforms.uIntensity.value +=
            (targetIntensity - tkGlowMesh.material.uniforms.uIntensity.value) * 0.1;
        tkGlowMesh.material.uniforms.uTime.value = clock.elapsedTime;
        // Scale with object size
        const scale = 1.2 + Math.sin(clock.elapsedTime * 2) * 0.1;
        tkGlowMesh.scale.setScalar(scale);
    } else {
        tkGlowMesh.material.uniforms.uIntensity.value *= 0.9;
        if (tkGlowMesh.material.uniforms.uIntensity.value < 0.01) {
            tkGlowMesh.visible = false;
        }
    }
}

function updateTelekinesis(dt) {
    // Lift held object
    if (tkMode && tkTarget && !tkLifted) {
        tkLiftProgress = Math.min(1, tkLiftProgress + dt * 1.6);
        const t = tkLiftProgress;
        const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

        const targetPos = new THREE.Vector3();
        camera.getWorldPosition(targetPos);
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        targetPos.addScaledVector(dir, TK_HOLD_DIST);
        targetPos.y = Math.max(targetPos.y, TK_LIFT_HEIGHT);

        tkTarget.position.lerp(targetPos, eased * 0.12 + 0.04);
        tkTarget.rotation.y += dt * 0.8;

        if (tkLiftProgress >= 1) {
            tkLifted = true;
            const hint = document.getElementById('tk-hint');
            if (hint) { hint.textContent = '[ F / TAP ] THROW'; hint.style.display = 'block'; }
        }
    }

    // Hold object in front of camera while lifted
    if (tkMode && tkTarget && tkLifted) {
        const targetPos = new THREE.Vector3();
        camera.getWorldPosition(targetPos);
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        targetPos.addScaledVector(dir, TK_HOLD_DIST);
        targetPos.y = Math.max(targetPos.y, TK_LIFT_HEIGHT);
        tkTarget.position.lerp(targetPos, 0.16);
        tkTarget.rotation.y += dt * 1.2;
    }

    // Update in-flight thrown objects
    for (let i = tkInFlight.length - 1; i >= 0; i--) {
        const f = tkInFlight[i];
        f.life -= dt;
        f.vel.y -= 9.8 * dt;  // gravity
        f.obj.position.addScaledVector(f.vel, dt);
        f.obj.rotation.x += f.rotVel.x * dt;
        f.obj.rotation.y += f.rotVel.y * dt;
        f.obj.rotation.z += f.rotVel.z * dt;
        // simple floor clamp
        if (f.obj.position.y < 0.1) {
            f.obj.position.y = 0.1;
            f.vel.set(0, 0, 0);
        }
        if (f.life <= 0) tkInFlight.splice(i, 1);
    }
}

// Desktop telekinesis key
document.addEventListener('keydown', (e) => {
    if (e.code === 'KeyF') toggleTelekinesis();
});

// Mobile telekinesis button
document.getElementById('tk-btn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    toggleTelekinesis();
}, { passive: false });

function createHorrorPickup(x, y, z, type, label) {
    const group = new THREE.Group();
    const isFile = type === 'file';
    const mat = new THREE.MeshStandardMaterial({
        color: isFile ? 0xc8b88a : 0x495364,
        roughness: 0.72,
        metalness: isFile ? 0.02 : 0.56,
        emissive: isFile ? 0x2f210d : 0x142333,
        emissiveIntensity: 0.75
    });
    const mesh = isFile
        ? new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.055, 0.42), mat)
        : new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.28, 0.10), mat);
    mesh.castShadow = true;
    group.add(mesh);
    if (isFile) {
        const band = new THREE.Mesh(new THREE.BoxGeometry(0.33, 0.061, 0.055), new THREE.MeshStandardMaterial({ color: 0x6e1212, roughness: 0.75, emissive: 0x240303, emissiveIntensity: 0.55 }));
        band.position.z = 0.11;
        group.add(band);
    } else {
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.045, 0.12), new THREE.MeshStandardMaterial({ color: 0x15191e, roughness: 0.32, metalness: 0.8 }));
        cap.position.y = 0.16;
        group.add(cap);
    }
    const glow = new THREE.PointLight(isFile ? 0xc09236 : 0x4f91c9, 0.72, 2.8);
    glow.position.y = 0.35;
    group.add(glow);
    group.position.set(x, y, z);
    scene.add(group);
    horror.pickups.push({ group, type, label, glow, taken: false, phase: Math.random() * Math.PI * 2 });
}

function createHorrorEcho() {
    const group = new THREE.Group();
    const cloth = new THREE.MeshStandardMaterial({ color: 0xd6d8cb, roughness: 0.9, transparent: true, opacity: 0.82, emissive: 0x132015, emissiveIntensity: 0.25 });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 12, 10), new THREE.MeshStandardMaterial({ color: 0xded8c8, roughness: 1, emissive: 0x0b120c, emissiveIntensity: 0.4 }));
    head.position.y = 1.65;
    const torso = new THREE.Mesh(new THREE.ConeGeometry(0.38, 1.36, 12, 1, true), cloth);
    torso.position.y = 0.77;
    const armGeo = new THREE.CylinderGeometry(0.045, 0.07, 0.92, 8);
    [-0.29, 0.29].forEach(side => {
        const arm = new THREE.Mesh(armGeo, cloth);
        arm.position.set(side, 0.93, 0);
        arm.rotation.z = side * 0.36;
        group.add(arm);
    });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2929, transparent: true, opacity: 0.92 });
    [-0.07, 0.07].forEach(side => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.026, 8, 6), eyeMat);
        eye.position.set(side, 1.68, 0.17);
        group.add(eye);
    });
    group.add(torso, head);
    group.visible = false;
    scene.add(group);
    horror.echo = group;
}

function updateHorrorDirector(dt) {
    if (!horror.echo) return;
    const now = clock.elapsedTime;
    const inBlackout = now < horror.blackoutUntil;
    const activeFlashlight = horror.flashlightOn && horror.battery > 0 && !inBlackout;

    horror.battery = Math.max(0, horror.battery - (activeFlashlight ? dt * 0.21 : dt * 0.025));
    const power = activeFlashlight ? (0.27 + 0.73 * (horror.battery / 100)) : 0;
    flashlight.intensity = 25 * power;
    if (window._flashlightOuter) window._flashlightOuter.intensity = 6 * power;
    if (volumetricLight) volumetricLight.visible = !PERFORMANCE_MODE && activeFlashlight;

    if (inBlackout) {
        scene.fog.density = Math.max(scene.fog.density, 0.078);
        document.getElementById('vignette-flash').style.background = 'rgba(32,0,0,0.22)';
    } else if (document.getElementById('vignette-flash').style.background) {
        document.getElementById('vignette-flash').style.background = 'rgba(120,0,0,0)';
    }

    updateHorrorPickups(now);
    updateHorrorSetPieces(now);
    updateHospitalExpansionTerror(now);
    updateCorridorStalker(now, dt);
    updateEcho(now, dt);

    horror.lastWhisper -= dt;
    if (horror.lastWhisper <= 0 && camera.position.z < -8 && Math.random() < 0.012) {
        horror.lastWhisper = 8 + Math.random() * 11;
        addStress(3.5);
        horrorTone(32 + Math.random() * 42, 0.55, 0.018, 'sawtooth');
        showHorrorMessage(['NO MIRES ATRÁS', 'NO ESTÁ VACÍO', 'TE ESCUCHA'][Math.floor(Math.random() * 3)], 1.5);
    }

    if (horror.stress >= 100 && now > horror.collapseUntil) triggerCollapse();
    updateHorrorHud();
}

function updateHorrorPickups(now) {
    let closest = null;
    let closestDist = 1.45;
    horror.pickups.forEach(item => {
        if (item.taken) return;
        item.group.rotation.y += deltaTime * 0.85;
        item.group.position.y = (item.type === 'file' ? 0.12 : 0.13) + Math.sin(now * 2.1 + item.phase) * 0.045;
        item.glow.intensity = 0.55 + Math.sin(now * 4 + item.phase) * 0.25;
        const dist = camera.position.distanceTo(item.group.position);
        if (dist < closestDist) { closest = item; closestDist = dist; }
    });
    horror.nearestPickup = closest;
}

function updateHorrorSetPieces(now) {
    horror.setPieces.forEach(piece => {
        if (!piece.done && camera.position.z <= piece.z) {
            piece.done = true;
            if (piece.type === 'shadow') {
                manifestEcho(7.2, 1.25);
                showHorrorMessage('ALGO CRUZÓ EL PASILLO.', 2.2);
                addStress(12);
            } else if (piece.type === 'blackout') {
                triggerBlackout(3.0);
                setTimeout(() => manifestEcho(5.5, 1.5), 700);
                showHorrorMessage('FALLO ELÉCTRICO. NO CORRAS.', 3.0);
                addStress(18);
            } else if (piece.type === 'stalker') {
                startCorridorStalker();
            } else if (piece.type === 'wheelchair') {
                sendWheelchair();
                showHorrorMessage('ESCUCHAS RUEDAS DETRÁS DE TI.', 2.4);
                addStress(15);
            } else if (piece.type === 'whisper') {
                triggerBlackout(1.5);
                if (corridorStalker.completed) {
                    showHorrorMessage('LA PUERTA DEL FONDO SE CERRÓ DETRÁS DE TI.', 3.0);
                    addStress(8);
                } else {
                    startChase(7.5);
                    showHorrorMessage('CORRE. YA TE VIO.', 3.0);
                }
            }
        }
    });
}

function manifestEcho(distance, duration) {
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    const pos = camera.position.clone().addScaledVector(forward, distance);
    pos.x = Math.max(-2.15, Math.min(2.15, pos.x));
    pos.y = 0;
    horror.echo.position.copy(pos);
    horror.echo.lookAt(camera.position.x, 1.1, camera.position.z);
    horror.echo.visible = true;
    horror.echoUntil = clock.elapsedTime + duration;
    horrorTone(60, 0.3, 0.04, 'triangle');
}

function updateEcho(now, dt) {
    if (horror.chaseUntil > now) {
        if (!horror.echo.visible) {
            horror.echo.position.set(camera.position.x + 0.6, 0, camera.position.z + 8);
            horror.echo.visible = true;
        }
        const toPlayer = camera.position.clone().sub(horror.echo.position);
        toPlayer.y = 0;
        const dist = toPlayer.length();
        if (dist > 0.1) horror.echo.position.addScaledVector(toPlayer.normalize(), dt * 2.55);
        horror.echo.position.y = Math.sin(now * 5.5) * 0.035;
        horror.echo.lookAt(camera.position.x, 1.1, camera.position.z);
        addStress(dt * 13);
        if (dist < 1.15) triggerCollapse();
    } else if (horror.echo.visible && now > horror.echoUntil) {
        horror.echo.visible = false;
    }
}

function sendWheelchair() {
    const chair = new THREE.Group();
    const metal = new THREE.MeshStandardMaterial({ color: 0x293139, roughness: 0.55, metalness: 0.75 });
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.11, 0.62), metal);
    seat.position.y = 0.48;
    chair.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.72, 0.08), metal);
    back.position.set(0, 0.81, 0.27);
    chair.add(back);
    [-0.36, 0.36].forEach(x => {
        const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.29, 0.045, 8, 16), metal);
        wheel.rotation.y = Math.PI / 2;
        wheel.position.set(x, 0.3, 0);
        chair.add(wheel);
    });
    chair.position.set(2.65, 0, camera.position.z - 4.5);
    scene.add(chair);
    const start = clock.elapsedTime;
    const rush = () => {
        const t = clock.elapsedTime - start;
        if (t < 1.55) {
            chair.position.x -= deltaTime * 4.8;
            chair.rotation.z = Math.sin(t * 19) * 0.15;
            requestAnimationFrame(rush);
        } else {
            scene.remove(chair);
        }
    };
    rush();
    horrorTone(88, 0.45, 0.04, 'square');
}

function triggerBlackout(duration) {
    horror.blackoutUntil = Math.max(horror.blackoutUntil, clock.elapsedTime + duration);
    horrorTone(45, 0.45, 0.05, 'sawtooth');
    lights.forEach(l => { if (l.light && l.baseInt > 0) l.light.intensity *= 0.08; });
}

function startChase(duration) {
    horror.chaseUntil = clock.elapsedTime + duration;
    horror.echoUntil = horror.chaseUntil;
    horrorTone(42, 0.8, 0.05, 'sawtooth');
}

function collectHorrorPickup(item) {
    if (!item || item.taken) return false;
    item.taken = true;
    item.group.visible = false;
    scene.remove(item.group);
    if (item.type === 'battery') {
        horror.battery = Math.min(100, horror.battery + 42);
        showHorrorMessage('BATERÍA INSTALADA. LUZ RESTAURADA.', 2.4);
        horrorTone(210, 0.14, 0.035, 'sine');
    } else {
        horror.filesFound += 1;
        addStress(7);
        if (horror.filesFound === 1) {
            showHorrorMessage('EXPEDIENTE 06-A: "NO RESPONDE A LA LUZ"', 3.2);
            manifestEcho(5.5, 1.1);
        } else if (horror.filesFound === 2) {
            showHorrorMessage('EXPEDIENTE 06-B: "NO ABRAS LA PUERTA ROJA"', 3.2);
            triggerBlackout(1.2);
            startChase(4.4);
        } else {
            horror.endUnlocked = true;
            showHorrorMessage('EXPEDIENTE 06-C: ADMISIONES ES LA ÚNICA SALIDA.', 4.0);
            addStress(11);
        }
        horrorTone(180, 0.18, 0.03, 'triangle');
    }
    return true;
}

function addStress(amount) {
    horror.stress = Math.max(0, Math.min(100, horror.stress + amount));
    if (amount > 8) {
        const canvas = document.getElementById('game-canvas');
        canvas.classList.remove('ca-flash');
        void canvas.offsetWidth;
        canvas.classList.add('ca-flash');
    }
}

function triggerCollapse() {
    const now = clock.elapsedTime;
    if (now < horror.collapseUntil) return;
    horror.collapseUntil = now + 3.5;
    horror.chaseUntil = 0;
    horror.echo.visible = false;
    document.getElementById('vignette-flash').style.background = 'rgba(130,0,0,0.82)';
    showHorrorMessage('TE ENCONTRÓ. DESPIERTA.', 2.8);
    horrorTone(28, 0.9, 0.07, 'sawtooth');
    setTimeout(() => {
        camera.position.set(0, 1.6, Math.min(12, camera.position.z + 5));
        horror.stress = 42;
        horror.battery = Math.max(28, horror.battery);
        horror.blackoutUntil = clock.elapsedTime + 0.9;
        document.getElementById('vignette-flash').style.background = 'rgba(120,0,0,0)';
    }, 1350);
}

function updateHorrorHud() {
    const battery = Math.round(horror.battery);
    const stress = Math.round(horror.stress);
    const batteryFill = document.getElementById('battery-fill');
    const stressFill = document.getElementById('stress-fill');
    batteryFill.style.width = `${battery}%`;
    stressFill.style.width = `${stress}%`;
    stressFill.style.background = stress > 70 ? 'linear-gradient(90deg,#a02b20,#ff6b56)' : 'linear-gradient(90deg,#792020,#d65a50)';
    document.getElementById('file-counter').textContent = `EXPEDIENTES: ${horror.filesFound} / 3`;
    const objective = horror.endUnlocked
        ? 'REGRESA A ADMISIONES. NO TE DETENGAS.'
        : horror.filesFound < 3
            ? `ENCUENTRA EXPEDIENTES (${horror.filesFound}/3)`
            : 'LOCALIZA LA SALIDA';
    document.getElementById('objective-text').textContent = objective;
    document.getElementById('horror-hud').classList.toggle('panic', stress > 75 || horror.chaseUntil > clock.elapsedTime);
    const message = document.getElementById('horror-message');
    message.classList.toggle('active', clock.elapsedTime < horror.messageUntil);
}

function showHorrorMessage(text, duration) {
    const msg = document.getElementById('horror-message');
    msg.textContent = text;
    horror.messageUntil = Math.max(horror.messageUntil, clock.elapsedTime + duration);
    msg.classList.add('active');
}

function initHorrorAudio() {
    if (horror.audioReady) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    try {
        horror.audioCtx = new AudioCtx();
        horror.audioCtx.resume();
        horror.audioReady = true;
    } catch (_) { horror.audioReady = false; }
}

function horrorTone(freq, duration, volume, wave = 'sine') {
    if (!horror.audioReady || !horror.audioCtx) return;
    try {
        const ctx = horror.audioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(18, freq * 0.48), ctx.currentTime + duration);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration + 0.04);
    } catch (_) { /* Audio is optional; visual terror remains intact. */ }
}

// Override generic door interaction so the same control collects survival items.
function toggleNearestDoor() {
    if (horror.nearestPickup) {
        collectHorrorPickup(horror.nearestPickup);
        return;
    }
    if (!nearestDoor) return;
    nearestDoor.isOpen = !nearestDoor.isOpen;
    nearestDoor.targetAngle = nearestDoor.isOpen ? nearestDoor.openAngle : nearestDoor.closedAngle;
    if (nearestDoor.sealMesh) nearestDoor.sealMesh.visible = !nearestDoor.isOpen;
    if (!nearestDoor.isOpen && Math.random() < 0.22) addStress(2.5);
}

function updateDoorInteraction() {
    const prompt = document.getElementById('interact-prompt');
    let closest = null;
    let closestDist = DOOR_INTERACT_DIST;
    doors.forEach(d => {
        const dist = camera.position.distanceTo(d.worldPos);
        if (dist < closestDist) { closestDist = dist; closest = d; }
        const diff = d.targetAngle - d.currentAngle;
        if (Math.abs(diff) > 0.001) {
            d.currentAngle += diff * Math.min(1, deltaTime * 5);
            d.doorMesh.rotation.y = d.currentAngle;
        }
        if (d.sealMesh) d.sealMesh.visible = !d.isOpen;
    });
    nearestDoor = closest;
    if (horror.nearestPickup) {
        prompt.style.display = 'block';
        prompt.textContent = horror.nearestPickup.type === 'file' ? '[ E ] RECOGER EXPEDIENTE' : '[ E ] TOMAR BATERÍA';
    } else if (nearestDoor) {
        prompt.style.display = 'block';
        prompt.textContent = nearestDoor.isOpen ? '[ E ] CERRAR PUERTA' : '[ E ] ABRIR PUERTA';
    } else {
        prompt.style.display = 'none';
    }
}

function expansionMaterial(color, roughness = 0.85, metalness = 0.05) {

function buildVigilAtrium() {
    const width = 17, depth = 23, centerZ = 35.25, ceilingH = 5.3;

    const darkStone = expansionMaterial(0x11120f, 0.92);

            cap.position.set(x * 0.86, ceilingH - 0.12, z); cap.castShadow = true; scene.add(cap);
        }
    });
    const rearWall = new THREE.Mesh(new THREE.BoxGeometry(width, ceilingH, 0.24), stone);
    rearWall.position.set(0, ceilingH / 2, 46.75); rearWall.castShadow = true; rearWall.receiveShadow = true; scene.add(rearWall);

    const sign = createExpansionSign('CAPILLA DE VIGILIA', '#b79b56', '#0a0907');
    sign.position.set(0, 4.45, 25.36); sign.rotation.y = Math.PI; scene.add(sign);

    // Bancas torcidas para reforzar la escala de la capilla.
    for (let row = 0; row < 4; row++) {

    // Altar, relicario y figura encapuchada de piedra.

    const relic = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.18, 0.56, 10), brass);
    relic.position.set(0, 1.54, 43.95); relic.castShadow = true; scene.add(relic);
    const flame = new THREE.PointLight(0xe07c2b, 1.6, 4.2);
    flame.position.set(0, 1.86, 43.95); scene.add(flame); hospitalExpansion.atriumLights.push({ light: flame, base: 1.6, phase: 0.2 });

    const statue = createVeiledStatue();
    statue.position.set(-5.85, 0, 43.2); statue.rotation.y = -0.5; scene.add(statue);
    hospitalExpansion.statue = statue;

    // Confesionarios sellados, velas y carpetas de admisiones abandonadas.
    [-6.35, 6.35].forEach((x, i) => {
        const booth = createConfessional(); booth.position.set(x, 0, 30.2 + i * 9.4); booth.rotation.y = i ? Math.PI : 0; scene.add(booth);
    });
    for (let i = 0; i < 14; i++) {
        const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.24 + Math.random() * 0.12, 8), expansionMaterial(0xc1ae80, 0.9));
        candle.position.set((Math.random() - 0.5) * 5.8, 0.13, 27.4 + Math.random() * 17.6);
        candle.castShadow = true; scene.add(candle);
        if (i < 5) {
            const candleLight = new THREE.PointLight(0xd67b30, 0.28, 1.65);
            candleLight.position.copy(candle.position); candleLight.position.y += 0.28;
            scene.add(candleLight); hospitalExpansion.atriumLights.push({ light: candleLight, base: 0.28, phase: i });
        }

    createStainedGlassWindow(0, 3.18, 46.6, 2.6, 3.25);

function createChapelBench() {
    const group = new THREE.Group();
    const wood = expansionMaterial(0x24170e, 0.78, 0.06);
    const seat = new THREE.Mesh(new THREE.BoxGeometry(2.05, 0.12, 0.48), wood); seat.position.y = 0.56;
    const back = new THREE.Mesh(new THREE.BoxGeometry(2.05, 0.67, 0.10), wood); back.position.set(0, 0.88, 0.22); back.rotation.x = -0.12;
    group.add(seat, back);
    [-0.82, 0.82].forEach(x => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.56, 0.38), wood); leg.position.set(x, 0.28, 0); group.add(leg);
    });
    return group;
}

function createConfessional() {
    const group = new THREE.Group();
    const wood = expansionMaterial(0x1a120b, 0.86, 0.04);
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.32, 2.18, 1.04), wood); body.position.y = 1.09; body.castShadow = true; group.add(body);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.92, 0.44, 4), wood); roof.position.y = 2.38; roof.rotation.y = Math.PI / 4; group.add(roof);
    const slit = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.68, 0.04), new THREE.MeshBasicMaterial({ color: 0x020202 })); slit.position.set(0, 1.42, 0.54); group.add(slit);
    return group;
}

function createVeiledStatue() {
    const group = new THREE.Group();
    const stone = expansionMaterial(0x67675e, 0.94);
    const darkStone = expansionMaterial(0x363832, 0.98);
    const profile = [
        new THREE.Vector2(0.42, 0.00), new THREE.Vector2(0.64, 0.10), new THREE.Vector2(0.56, 0.34),
        new THREE.Vector2(0.43, 0.72), new THREE.Vector2(0.50, 1.10), new THREE.Vector2(0.34, 1.48),
        new THREE.Vector2(0.22, 1.73), new THREE.Vector2(0.17, 1.92)
    ];
    const plinthLow = new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.86, 0.18, 12), darkStone); plinthLow.position.y = 0.09; group.add(plinthLow);
    const plinth = new THREE.Mesh(new THREE.CylinderGeometry(0.60, 0.72, 0.33, 12), stone); plinth.position.y = 0.255; group.add(plinth);
    const body = new THREE.Mesh(new THREE.LatheGeometry(profile, 16), stone); body.position.y = 0.42; group.add(body);
    // Pliegues de velo: costillas independientes que hacen reconocible la silueta desde lejos.
    for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2;
        const fold = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.052, 1.62, 7), darkStone);
        fold.position.set(Math.cos(a) * 0.37, 1.20, Math.sin(a) * 0.37);
        fold.rotation.z = Math.cos(a) * 0.15; fold.rotation.x = Math.sin(a) * 0.15; group.add(fold);
    }
    const hood = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 12), darkStone); hood.scale.set(1.0, 1.16, 0.92); hood.position.y = 2.30; group.add(hood);
    const faceVoid = new THREE.Mesh(new THREE.SphereGeometry(0.19, 12, 9), new THREE.MeshBasicMaterial({ color: 0x050606 })); faceVoid.scale.set(0.76, 1.10, 0.42); faceVoid.position.set(0, 2.28, 0.28); group.add(faceVoid);
    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.31, 0.028, 8, 18), stone); collar.rotation.x = Math.PI / 2; collar.position.y = 1.91; group.add(collar);
    group.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
    return group;
}

function createChandelier() {
    const group = new THREE.Group();
    const metal = expansionMaterial(0x191915, 0.48, 0.74);
    const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.2, 8), metal); cable.position.y = 0.34; group.add(cable);

        arm.rotation.z = Math.PI / 2; arm.rotation.y = angle; arm.position.set(Math.cos(angle) * 0.42, -0.24, Math.sin(angle) * 0.42); group.add(arm);
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 8), new THREE.MeshBasicMaterial({ color: 0x7d280b }));
        bulb.position.set(Math.cos(angle) * 0.86, -0.24, Math.sin(angle) * 0.86); group.add(bulb);
    }
    return group;
}

function createStainedGlassWindow(x, y, z, width, height) {
    const tex = createTexture(512, 768, (ctx, w, h) => {
        ctx.fillStyle = '#120b13'; ctx.fillRect(0, 0, w, h);
        const colors = ['#6e151b', '#a84b25', '#1c3f5d', '#8d7431', '#2c5b4f'];

// Extiende los límites físicos del jugador a las dos nuevas alas, manteniendo
// la navegación ya existente del vestíbulo, pasillo principal y habitaciones.
function checkBoundary(pos) {
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    // Navegación prioritaria por zona: sin condiciones solapadas que devuelvan al jugador al mismo punto.
    const inSecretRoute = hospitalExpansion.secretUnlocked && pos.x >= 24.75 && pos.x <= 37.55 && pos.z >= 13.8 && pos.z <= 24.2;
    if (inSecretRoute) {
        pos.x = clamp(pos.x, 24.75, 37.25);
        pos.z = clamp(pos.z, 14.15, 23.65);
        return;
    }

    const inHydro = pos.x >= 9.0 && pos.x <= 26.1 && pos.z >= 9.5 && pos.z <= 28.5;
    if (inHydro) {
        pos.x = clamp(pos.x, 9.0, 25.75);
        pos.z = clamp(pos.z, 10.0, 27.9);
        return;
    }

    const inAtrium = pos.z >= 23.0 && pos.z <= 46.8 && pos.x >= -8.6 && pos.x <= 8.6;
    if (inAtrium) {
        pos.x = clamp(pos.x, -8.15, 8.15);
        pos.z = clamp(pos.z, 23.35, 46.35);
        return;
    }

    // Vestíbulo de admisiones: área amplia y abierta para evitar atascos al comenzar.
    if (pos.z > 1.5) {
        pos.x = clamp(pos.x, -9.3, 9.3);
        pos.z = clamp(pos.z, 1.65, 23.25);
        return;
    }

    // Pasillo principal y habitaciones originales.
    const limitXRight = (HALL_WIDTH / 2) - 0.5;
    const limitXLeftHall = -(HALL_WIDTH / 2) + 0.5;
    pos.z = clamp(pos.z, -HALL_LENGTH + 2, 1.5);
    if (pos.x > limitXRight) pos.x = limitXRight;
    if (pos.x < limitXLeftHall) {
        let inOpenDoorway = null;
        for (const d of doors) {
            if (d.isOpen && pos.z <= d.doorZMax && pos.z >= d.doorZMin) { inOpenDoorway = d; break; }
        }
        if (inOpenDoorway) {
            const b = inOpenDoorway.roomBounds;
            pos.x = clamp(pos.x, b.xMin, b.xMax);
            pos.z = clamp(pos.z, b.zMin, b.zMax);
        } else pos.x = limitXLeftHall;
    }
}

            for (let i = 0; i < 2100; i++) {

                ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 3);
            }
            for (let i = 0; i < 36; i++) {

                for (let s = 0; s < 5; s++) { x += (Math.random() - 0.5) * 62; y += 12 + Math.random() * 36; ctx.lineTo(x, y); }

            }
        } else {

            for (let i = 0; i < 1100; i++) {

            }
        }
    });
}

function createStalkerAuraTexture() {
    return createTexture(256, 256, (ctx, w, h) => {
        const g = ctx.createRadialGradient(w / 2, h / 2, 2, w / 2, h / 2, w / 2);

        g.addColorStop(0.22, 'rgba(47,144,84,0.15)');

}

function animateStalkerVisuals(now, dt, distance, closeness) {
    const parts = corridorStalker.parts;
    if (!parts) return;
    const gait = now * (4.7 + closeness * 4.4);
    const pulse = 0.5 + 0.5 * Math.sin(now * (4.0 + closeness * 5.2));

    // La corona se abre y la pupila busca al jugador: el rostro es una máquina, no una cara.
    parts.halo.rotation.z = now * 0.32 + Math.sin(gait * 0.32) * 0.12;
    parts.halo.rotation.y = Math.sin(gait * 0.21) * 0.17;
    parts.petals.forEach((pivot, i) => { pivot.rotation.x = Math.sin(now * 1.9 + i * 0.8) * (0.10 + closeness * 0.20); });
    parts.pupil.scale.setScalar(0.88 + pulse * 0.25 + closeness * 0.13);
    parts.pupil.position.x = Math.sin(now * 1.45) * 0.045;
    parts.pupil.position.y = Math.cos(now * 1.17) * 0.035;

    // La jaula torácica respira y las patas invertidas marcan un paso antinatural.
    const breath = 0.94 + pulse * 0.12;
    parts.chest.scale.set(breath, 1 + pulse * 0.07, breath);
    parts.core.material.emissiveIntensity = 1.4 + pulse * 1.65 + closeness * 1.25;
    parts.ribs.forEach((rib, i) => { rib.rotation.y = Math.sin(now * 2.8 + i * 0.55) * 0.07; });
    parts.legs.forEach((leg, i) => {
        const side = i === 0 ? -1 : 1;
        leg.rotation.z = side * (0.12 + Math.sin(gait + i * Math.PI) * 0.27);
        leg.rotation.x = Math.cos(gait + i * Math.PI) * 0.15;
    });
    parts.stilts.forEach((stilt, i) => {
        const phase = gait + i * Math.PI;
        stilt.rotation.z = (i === 0 ? -1 : 1) * (0.12 + Math.sin(phase) * 0.10);
        stilt.position.y = 2.75 + Math.max(0, Math.sin(phase)) * 0.16;
    });
    parts.wheels.forEach((wheel, i) => { wheel.rotation.z -= dt * (6.5 + closeness * 8.0) * (i === 0 ? 1 : -1); });
    parts.strips.forEach((strip, i) => {
        strip.rotation.z += Math.sin(now * 5.4 + i * 0.9) * dt * (0.20 + closeness * 0.25);
        strip.rotation.x += Math.cos(now * 4.1 + i) * dt * 0.11;
    });

    if (corridorStalker.aura) {
        corridorStalker.aura.material.opacity = 0.10 + closeness * 0.31 + pulse * 0.075;
        const s = 4.5 + pulse * 0.35 + closeness * 0.9;
        corridorStalker.aura.scale.set(s, s * 1.32, 1);
    }
    if (corridorStalker.eyeLight) corridorStalker.eyeLight.intensity = 0.6 + pulse * 1.3 + closeness * 3.5;
    if (corridorStalker.floorGlow) corridorStalker.floorGlow.intensity = 0.24 + pulse * 0.22 + closeness * 1.2;
    if (distance < 2.7 && corridorStalker.impactTimer < now) {
        corridorStalker.impactTimer = now + 0.56;
        const canvas = document.getElementById('game-canvas');
        canvas.classList.remove('ca-flash'); void canvas.offsetWidth; canvas.classList.add('ca-flash');
        horrorTone(29 + pulse * 11, 0.18, 0.075, 'square');
    }
}

        const joint2 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 7), rust); joint2.position.set(side * 0.22, -2.38, 0.02); stilt.add(joint2);
        const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.048, 7, 14), dark); wheel.rotation.y = Math.PI / 2; wheel.position.set(side * 0.26, -2.64, 0.06); stilt.add(wheel); wheels.push(wheel);
        const hook = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.035, 7, 13, Math.PI * 1.32), rust); hook.rotation.z = side * (Math.PI / 2); hook.position.set(side * 0.31, -2.57, 0.13); stilt.add(hook); stilts.push(stilt);
        for (let i = 0; i < 4; i++) {
            const strip = new THREE.Mesh(new THREE.PlaneGeometry(0.12 + Math.random() * 0.16, 0.55 + Math.random() * 0.90), cloth);
            strip.position.set(side * (0.34 + Math.random() * 0.42), 1.95 - Math.random() * 1.6, (Math.random() - 0.5) * 0.28);
            strip.rotation.set((Math.random() - 0.5) * 0.45, Math.random() * Math.PI, (Math.random() - 0.5) * 0.35); group.add(strip); strips.push(strip);
        }
    });

    const aura = new THREE.Sprite(new THREE.SpriteMaterial({ map: createStalkerAuraTexture(), color: 0x52e6a0, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
    aura.scale.set(4.9, 6.2, 1); aura.position.y = 2.08; group.add(aura);
    const eyeLight = new THREE.PointLight(0x90ffbc, 0, 6.3); eyeLight.position.set(0, 3.48, 0.42); group.add(eyeLight);
    const floorGlow = new THREE.PointLight(0x17754e, 0, 5.2); floorGlow.position.set(0, 0.18, 0); group.add(floorGlow);
    group.traverse(obj => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
    group.visible = false; scene.add(group); corridorStalker.group = group;
    corridorStalker.parts = { mast, halo, petals, pupil, chest, core, ribs, legs, stilts, wheels, strips };
    corridorStalker.aura = aura; corridorStalker.eyeLight = eyeLight; corridorStalker.floorGlow = floorGlow;

    const seal = new THREE.Mesh(new THREE.BoxGeometry(1.55, 2.45, 0.11), new THREE.MeshStandardMaterial({ color: 0x101b21, roughness: 0.62, metalness: 0.72, emissive: 0x052938, emissiveIntensity: 0.52 }));
    seal.position.set(0, 1.24, -57.7); scene.add(seal);
    const signTexture = createTexture(512, 96, (ctx, w, h) => {
        ctx.fillStyle = '#06141a'; ctx.fillRect(0, 0, w, h); ctx.strokeStyle = '#70b7cb'; ctx.lineWidth = 4; ctx.strokeRect(6, 6, w - 12, h - 12);
        ctx.fillStyle = '#b1e8f2'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center'; ctx.fillText('SELLO DE SEGURIDAD', w / 2, 60);
    });
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.48), new THREE.MeshStandardMaterial({ map: signTexture, emissive: 0x1e7688, emissiveIntensity: 1.0, roughness: 0.45 }));
    sign.position.set(0, 3.03, -57.58); scene.add(sign);
    corridorStalker.beacon = new THREE.PointLight(0x4ebbe0, 0, 7.5); corridorStalker.beacon.position.set(0, 2.6, -55.4); scene.add(corridorStalker.beacon);
}

function startCorridorStalker() {
    if (corridorStalker.active || corridorStalker.completed || !corridorStalker.group) return;
    corridorStalker.active = true;
    corridorStalker.visible = false;
    corridorStalker.caught = false;
    corridorStalker.startedAt = clock.elapsedTime;
    corridorStalker.spawnAt = clock.elapsedTime + 1.55;
    corridorStalker.lastDistance = 11;
    corridorStalker.group.position.set(Math.max(-1.9, Math.min(1.9, camera.position.x + 0.45)), 0, Math.min(-3.8, camera.position.z + 10.8));
    triggerBlackout(1.15);
    showHorrorMessage('LA MATRONA DEL UMBRAL DESPIERTA. EL SELLO AZUL ESTÁ AL FONDO.', 3.8);
    horrorTone(38, 0.72, 0.055, 'sawtooth');
    document.getElementById('horror-hud').classList.add('panic');
}

function updateCorridorStalker(now, dt) {
    if (!corridorStalker.group) return;
    if (corridorStalker.beacon) {
        const guide = corridorStalker.active || (camera.position.z < -45 && !corridorStalker.completed);
        corridorStalker.beacon.intensity = guide ? 1.3 + Math.sin(now * 7.5) * 0.5 : 0;
    }
    if (!corridorStalker.active) return;

    if (now >= corridorStalker.spawnAt && !corridorStalker.visible) {
        corridorStalker.visible = true;
        corridorStalker.group.visible = true;
        showHorrorMessage('NO DEJES QUE LA MATRONA TE ENCUENTRE.', 2.5);
        horrorTone(53, 0.55, 0.065, 'triangle');
    }
    if (!corridorStalker.visible) return;

    const target = camera.position.clone(); target.y = 0;
    const toPlayer = target.sub(corridorStalker.group.position); toPlayer.y = 0;
    const distance = toPlayer.length();
    // Ligeramente más lento que el jugador: exige correr, pero permite escapar.
    const speed = 2.30 + Math.min(0.32, (now - corridorStalker.startedAt) * 0.025);
    if (distance > 0.08) corridorStalker.group.position.addScaledVector(toPlayer.normalize(), dt * speed);
    corridorStalker.group.position.x = Math.max(-2.18, Math.min(2.18, corridorStalker.group.position.x));
    corridorStalker.group.position.y = Math.abs(Math.sin(now * 8.2)) * 0.045;
    corridorStalker.group.lookAt(camera.position.x, 1.1, camera.position.z);
    corridorStalker.group.rotation.z = Math.sin(now * 5.4) * 0.038;
    corridorStalker.eyes.forEach((eye, idx) => {
        eye.material.opacity = 0.3 + 0.7 * Math.max(0, Math.sin(now * 9 + idx * 0.7));
    });

    const closeness = Math.max(0, 1 - Math.min(distance, 10) / 10);
    animateStalkerVisuals(now, dt, distance, closeness);
    addStress(dt * (7 + closeness * 16));
    cameraShake += closeness * dt * 0.12;
    if (distance < 4.2 && corridorStalker.lastDistance >= 4.2) {
        showHorrorMessage('ESTÁ MUY CERCA.', 1.35);
        horrorTone(71, 0.22, 0.075, 'square');
    }
    corridorStalker.lastDistance = distance;

    if (camera.position.z <= corridorStalker.safeZ) escapeCorridorStalker();
    else if (distance < 1.26) catchCorridorStalker();
}

function escapeCorridorStalker() {
    corridorStalker.active = false;
    corridorStalker.completed = true;
    corridorStalker.group.visible = false;
    horror.stress = Math.max(26, horror.stress - 22);
    triggerBlackout(0.38);
    showHorrorMessage('EL SELLO AGUANTÓ. POR AHORA.', 3.2);
    horrorTone(180, 0.36, 0.035, 'sine');
    setTimeout(() => document.getElementById('horror-hud').classList.remove('panic'), 1000);
}

function catchCorridorStalker() {
    if (corridorStalker.caught) return;
    corridorStalker.caught = true;
    corridorStalker.active = false;
    corridorStalker.group.visible = false;
    document.getElementById('vignette-flash').style.background = 'rgba(150,0,0,0.86)';
    showHorrorMessage('LA MATRONA TE HIZO PARTE DEL PABELLÓN.', 2.7);
    horrorTone(24, 0.82, 0.09, 'sawtooth');
    setTimeout(() => {
        camera.position.set(0, 1.6, -22.5);
        horror.stress = 48;
        horror.battery = Math.max(35, horror.battery);
        document.getElementById('vignette-flash').style.background = 'rgba(120,0,0,0)';
        document.getElementById('horror-hud').classList.remove('panic');
    }, 1250);
}

</script>
